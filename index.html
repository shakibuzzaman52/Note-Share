<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClassNotes — Simple Academic Note Sharing</title>
  <style>
    :root {
      --bg-page: #f8fafc;
      --bg-surface: #ffffff;
      --bg-muted: #f1f5f9;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --primary: #0f172a;
      --radius: 8px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-page);
      color: var(--text-main);
      line-height: 1.5;
      font-size: 15px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    a { color: inherit; text-decoration: none; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      gap: 6px; padding: 8px 14px; font-size: 14px; font-weight: 500;
      border-radius: var(--radius); border: 1px solid transparent;
      cursor: pointer; font-family: inherit;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-secondary { background: var(--bg-surface); border-color: var(--border-color); }
    .btn-icon { background: transparent; border: 1px solid var(--border-color); border-radius: 6px; padding: 4px 8px; cursor: pointer; }
    
    .site-header { background: var(--bg-surface); border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 20; }
    .header-container { max-width: 1040px; margin: 0 auto; padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; }
    .brand-link { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; font-size: 18px; }
    .sheet-status { font-size: 13px; color: var(--text-muted); display: inline-flex; align-items: center; gap: 6px; }
    .sheet-dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; }

    .main-container { max-width: 1040px; margin: 0 auto; padding: 24px 20px; width: 100%; flex: 1; }
    .filters-bar { background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: 12px; padding: 14px 18px; margin-bottom: 24px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
    .filter-group { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--text-muted); }
    select, input { font: inherit; font-size: 14px; background: var(--bg-page); border: 1px solid var(--border-color); border-radius: 6px; padding: 6px 10px; outline: none; }
    
    .content-grid { display: grid; grid-template-columns: 1.15fr 1fr; gap: 24px; align-items: start; }
    .card { background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; }
    
    .calendar-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .calendar-weekdays, .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
    .calendar-weekdays { font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; }
    .cal-day { aspect-ratio: 1; border: 1px solid transparent; border-radius: 6px; cursor: pointer; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .cal-day:hover { background: var(--bg-muted); }
    .cal-day.is-selected { background: var(--primary); color: #fff; font-weight: 700; }
    .cal-dot { width: 5px; height: 5px; background: #2563eb; border-radius: 50%; margin-top: 2px; }
    .cal-day.is-selected .cal-dot { background: #fff; }

    .notes-card { min-height: 350px; }
    .notes-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--border-color); }
    .course-group { margin-bottom: 16px; }
    .course-title { font-size: 15px; font-weight: 700; margin-bottom: 6px; }
    .topics-container { border-left: 2px solid var(--border-color); padding-left: 10px; }
    .note-link-item { display: inline-block; margin: 4px; padding: 5px 10px; background: var(--bg-page); border: 1px solid var(--border-color); border-radius: 6px; font-size: 13px; }

    .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 50; }
    .modal-backdrop.is-active { display: flex; }
    .modal-card { background: #fff; border-radius: 12px; width: 100%; max-width: 480px; padding: 20px; }
    .modal-form { display: flex; flex-direction: column; gap: 10px; }
    .modal-form label { font-size: 12px; font-weight: 600; color: var(--text-muted); }
    @media (max-width: 800px) { .content-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="header-container">
      <a href="./" class="brand-link">ClassNotes</a>
      <div style="display:flex; gap:12px; align-items:center;">
        <span class="sheet-status"><span class="sheet-dot"></span> Google Sheet</span>
        <button id="open-add-modal-btn" class="btn btn-primary">+ Add Note</button>
      </div>
    </div>
  </header>

  <main class="main-container">
    <section class="filters-bar">
      <div class="filter-group">
        <label for="dept-select">Department:</label>
        <select id="dept-select"></select>
      </div>
      <div class="filter-group">
        <label for="section-select">Section:</label>
        <select id="section-select"></select>
      </div>
      <span id="current-class-badge" style="margin-left:auto; font-weight:600;"></span>
    </section>

    <div class="content-grid">
      <section class="card">
        <div class="calendar-header">
          <h2 id="calendar-month-year"></h2>
          <div>
            <button id="cal-prev" class="btn-icon">&lt;</button>
            <button id="cal-today" class="btn-icon" style="padding:4px 10px;">Today</button>
            <button id="cal-next" class="btn-icon">&gt;</button>
          </div>
        </div>
        <div class="calendar-weekdays">
          <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
        </div>
        <div id="calendar-grid" class="calendar-grid"></div>
      </section>

      <section class="card notes-card">
        <div class="notes-header">
          <div>
            <small style="color:var(--text-muted);">SELECTED DATE</small>
            <h3 id="selected-date-display"></h3>
          </div>
          <span id="notes-count">0 notes</span>
        </div>
        <div id="notes-list"></div>
      </section>
    </div>
  </main>

  <div id="add-modal" class="modal-backdrop">
    <div class="modal-card">
      <div style="display:flex; justify-content:space-between; margin-bottom:12px;">
        <h3>Add Note</h3>
        <button id="close-modal" style="border:none; background:none; font-size:18px; cursor:pointer;">&times;</button>
      </div>
      <form id="note-form" class="modal-form">
        <label>Department: <select id="form-dept" required></select></label>
        <label>Section: <select id="form-section" required></select></label>
        <label>Date: <input type="date" id="form-date" required></label>
        <label>Course: <select id="form-course" required></select></label>
        <label>Topic: <input type="text" id="form-topic" placeholder="e.g. Binary Trees" required></label>
        <label>Title: <input type="text" id="form-title" placeholder="e.g. Lecture Slide" required></label>
        <label>Link: <input type="url" id="form-link" placeholder="Google Drive Link"></label>
        <div id="form-status" style="display:none; font-size:13px; padding:6px;"></div>
        <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:8px;">
          <button type="button" id="cancel-modal" class="btn btn-secondary">Cancel</button>
          <button type="submit" class="btn btn-primary">Submit</button>
        </div>
      </form>
    </div>
  </div>

  <script>
  (function() {
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw3aWwV--qQQMyplo3GnTexrnbTaGb5p_I-twV-fK4mokGSIA2PkOHQ7L9Ye05fv55T/exec";
    const DEPARTMENTS = [
      { code: "CSE", sections: ["73_L", "73_A", "73_B", "72_C", "71_A"], courses: ["CSE Fundamentals", "Data Structures & Algorithms", "Database Management Systems", "Computer Networks", "English"] },
      { code: "EEE", sections: ["65_A", "65_B"], courses: ["Circuit Analysis", "Signals & Systems", "Digital Electronics"] },
      { code: "BBA", sections: ["42_B", "42_A"], courses: ["Principles of Marketing", "Financial Accounting"] }
    ];

    const now = new Date();
    const state = {
      dept: "CSE",
      sec: "73_L",
      viewDate: new Date(now.getFullYear(), now.getMonth(), 1),
      selectedDate: now.toISOString().split("T")[0],
      notes: []
    };

    const $ = id => document.getElementById(id);

    function populateSelect(selectEl, items) {
      selectEl.innerHTML = items.map(item => `<option value="${item}">${item}</option>`).join("");
    }

    function init() {
      populateSelect($("dept-select"), DEPARTMENTS.map(d => d.code));
      populateSelect($("form-dept"), DEPARTMENTS.map(d => d.code));
      
      updateDropdowns();
      bindEvents();
      fetchNotes();
      render();
    }

    function updateDropdowns() {
      const activeDept = DEPARTMENTS.find(d => d.code === state.dept);
      populateSelect($("section-select"), activeDept.sections);
      populateSelect($("form-section"), activeDept.sections);
      populateSelect($("form-course"), activeDept.courses);
      $("dept-select").value = state.dept;
      $("section-select").value = state.sec;
    }

    async function fetchNotes() {
      try {
        const res = await fetch(SCRIPT_URL);
        const data = await res.json();
        if (data?.success && Array.isArray(data.notes)) {
          state.notes = data.notes.map(n => ({
            ...n,
            date: n.date ? new Date(n.date).toISOString().split("T")[0] : ""
          }));
          render();
        }
      } catch (e) {
        console.error("Fetch failed", e);
      }
    }

    function getFilteredNotes() {
      return state.notes.filter(n => 
        n.department?.toLowerCase() === state.dept.toLowerCase() &&
        n.section?.toLowerCase() === state.sec.toLowerCase() &&
        (n.status || "Approved").toLowerCase() === "approved"
      );
    }

    function render() {
      $("current-class-badge").textContent = `${state.dept} • ${state.sec}`;
      
      // ক্যালেন্ডার রেন্ডার
      const year = state.viewDate.getFullYear();
      const month = state.viewDate.getMonth();
      $("calendar-month-year").textContent = state.viewDate.toLocaleDateString("en-US", { month: "long", year: "numeric" });
      
      const firstDay = new Date(year, month, 1).getDay();
      const totalDays = new Date(year, month + 1, 0).getDate();
      const noteDates = new Set(getFilteredNotes().map(n => n.date));

      let gridHtml = "";
      for (let i = 0; i < firstDay; i++) gridHtml += `<div class="cal-day"></div>`;

      for (let d = 1; d <= totalDays; d++) {
        const dateStr = `${year}-${String(month + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
        const isSelected = dateStr === state.selectedDate;
        const hasDot = noteDates.has(dateStr);
        gridHtml += `
          <button class="cal-day ${isSelected ? 'is-selected' : ''}" data-date="${dateStr}">
            <span>${d}</span>
            ${hasDot ? '<span class="cal-dot"></span>' : ''}
          </button>`;
      }
      $("calendar-grid").innerHTML = gridHtml;

      // নোটস সেকশন রেন্ডার
      $("selected-date-display").textContent = new Date(state.selectedDate + "T00:00:00").toLocaleDateString("en-US", { day: "numeric", month: "long", year: "numeric" });
      const currentNotes = getFilteredNotes().filter(n => n.date === state.selectedDate);
      $("notes-count").textContent = `${currentNotes.length} notes`;

      if (!currentNotes.length) {
        $("notes-list").innerHTML = `<p style="color:var(--text-muted); padding: 20px 0;">No notes for this date.</p>`;
        return;
      }

      const grouped = {};
      currentNotes.forEach(n => {
        if (!grouped[n.course]) grouped[n.course] = {};
        if (!grouped[n.course][n.topic]) grouped[n.course][n.topic] = [];
        grouped[n.course][n.topic].push(n);
      });

      $("notes-list").innerHTML = Object.entries(grouped).map(([course, topics]) => `
        <div class="course-group">
          <h4 class="course-title">${course}</h4>
          <div class="topics-container">
            ${Object.entries(topics).map(([topic, items]) => `
              <div style="margin-bottom:8px;">
                <small style="color:var(--text-muted); font-weight:600;">&rarr; ${topic}</small>
                <div>
                  ${items.map(item => `
                    <a href="${item.link || 'javascript:void(0)'}" ${item.link ? 'target="_blank" rel="noopener"' : ''} class="note-link-item">
                      ${item.title} ↗
                    </a>`).join("")}
                </div>
              </div>`).join("")}
          </div>
        </div>`).join("");
    }

    function bindEvents() {
      $("dept-select").onchange = e => {
        state.dept = e.target.value;
        updateDropdowns();
        state.sec = $("section-select").value;
        render();
      };
      
      $("section-select").onchange = e => {
        state.sec = e.target.value;
        render();
      };

      // মাসের নেভিগেশন এক লাইনে
      $("cal-prev").onclick = () => { state.viewDate.setMonth(state.viewDate.getMonth() - 1); render(); };
      $("cal-next").onclick = () => { state.viewDate.setMonth(state.viewDate.getMonth() + 1); render(); };
      $("cal-today").onclick = () => {
        const today = new Date();
        state.viewDate = new Date(today.getFullYear(), today.getMonth(), 1);
        state.selectedDate = today.toISOString().split("T")[0];
        render();
      };

      // ইভেন্ট ডেলিগেশন দিয়ে ক্যালেন্ডার ক্লিক হ্যান্ডেল
      $("calendar-grid").onclick = e => {
        const btn = e.target.closest(".cal-day[data-date]");
        if (btn) {
          state.selectedDate = btn.dataset.date;
          render();
        }
      };

      // মোডাল হ্যান্ডলিং
      const modal = $("add-modal");
      $("open-add-modal-btn").onclick = () => {
        $("form-dept").value = state.dept;
        updateDropdowns();
        $("form-date").value = state.selectedDate;
        modal.classList.add("is-active");
      };
      $("close-modal").onclick = $("cancel-modal").onclick = () => modal.classList.remove("is-active");

      $("note-form").onsubmit = async e => {
        e.preventDefault();
        const status = $("form-status");
        status.style.display = "block";
        status.textContent = "Submitting...";

        const payload = {
          department: $("form-dept").value,
          section: $("form-section").value,
          date: $("form-date").value,
          course: $("form-course").value,
          topic: $("form-topic").value,
          title: $("form-title").value,
          link: $("form-link").value || ""
        };

        try {
          await fetch(SCRIPT_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify(payload)
          });
          status.textContent = "Submitted successfully!";
          setTimeout(() => { modal.classList.remove("is-active"); status.style.display = "none"; }, 1500);
        } catch {
          status.textContent = "Failed or check Google Sheets.";
        }
      };
    }

    init();
  })();
  </script>
</body>
</html>
