<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClassNotes</title>
</head>
<body>

  <!-- header -->
  <header>
    <h1>ClassNotes</h1>
    <button id="open-add-modal-btn" type="button">+ Add Note</button>
  </header>

  <hr>

  <!-- filters -->
  <section>
    <label for="dept-select">Department:</label>
    <select id="dept-select"></select>

    <label for="section-select">Section:</label>
    <select id="section-select"></select>

    <label for="course-select">Course:</label>
    <select id="course-select"></select>

    <strong id="current-class-badge"></strong>
  </section>

  <hr>

  <!-- main functional areas -->
  <main>
    
    <!-- calendar view (for ALL courses) -->
    <section id="full-calendar-view">
      <div>
        <h2 id="calendar-month-year"></h2>
        <button id="cal-prev" type="button">&lt; Prev</button>
        <button id="cal-today" type="button">Today</button>
        <button id="cal-next" type="button">Next &gt;</button>
      </div>

      <table border="1">
        <thead>
          <tr>
            <th>Sun</th><th>Mon</th><th>Tue</th><th>Wed</th><th>Thu</th><th>Fri</th><th>Sat</th>
          </tr>
        </thead>
        <tbody id="calendar-grid"></tbody>
      </table>
      <p><small>* Days with notes show a bullet (•)</small></p>
    </section>

    <!-- dates list (for a specific course) -->
    <section id="course-dates-view" hidden>
      <h3 id="course-dates-title"></h3>
      <span id="course-dates-count"></span>
      <div id="course-dates-list"></div>
    </section>

    <hr>

    <!-- notes display -->
    <section>
      <div>
        <h3 id="selected-date-display"></h3>
        <span id="notes-count"></span>
      </div>
      <div id="notes-list"></div>
    </section>

  </main>

  <!-- add note modal -->
  <dialog id="add-modal">
    <form id="note-form" method="dialog">
      <h3>Add New Note</h3>

      <p>
        <label for="form-dept">Department:</label><br>
        <select id="form-dept" required></select>
      </p>
      <p>
        <label for="form-section">Section:</label><br>
        <select id="form-section" required></select>
      </p>
      <p>
        <label for="form-date">Date:</label><br>
        <input type="date" id="form-date" required>
      </p>
      <p>
        <label for="form-course">Course:</label><br>
        <select id="form-course" required></select>
      </p>
      <p>
        <label for="form-topic">Topic:</label><br>
        <input type="text" id="form-topic" placeholder="e.g. Binary Search Trees" required>
      </p>
      <p>
        <label for="form-title">Title:</label><br>
        <input type="text" id="form-title" placeholder="e.g. Note 1" required>
      </p>
      <p>
        <label for="form-link">Resource Link:</label><br>
        <input type="url" id="form-link" placeholder="https://drive.google.com/...">
      </p>

      <p id="form-status" hidden></p>

      <div>
        <button type="button" id="cancel-modal">Cancel</button>
        <button type="submit" id="submit-btn">Submit Note</button>
      </div>
    </form>
  </dialog>

  <!-- report modal -->
  <dialog id="report-modal">
    <form id="report-form" method="dialog">
      <h3>Report Note Link</h3>
      <p>
        <strong>Note:</strong> <span id="report-target-title"></span><br>
        <span id="report-target-meta"></span>
      </p>
      <p>Having trouble opening this link? Report it to alert the class.</p>

      <p id="report-status" hidden></p>

      <div>
        <button type="button" id="cancel-report-modal">Cancel</button>
        <button type="submit" id="submit-report-btn">Report Link</button>
      </div>
    </form>
  </dialog>

  <script src="config.js"></script>
  <script src="app.js"></script>

</body>
</html>
