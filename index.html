<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClassNotes — Simple Academic Note Sharing</title>
  <meta name="description" content="A simple, clean, and minimal class-notes sharing website for students.">
  <style>
    :root {
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --bg-page: #f8fafc;
      --bg-surface: #ffffff;
      --bg-muted: #f1f5f9;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --text-light: #94a3b8;
      --border-color: #e2e8f0;
      --primary: #0f172a;
      --primary-hover: #1e293b;
      --accent-dot: #2563eb;
      --radius-sm: 6px;
      --radius-md: 8px;
      --radius-lg: 12px;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
      --transition: 0.15s ease-in-out;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-sans);
      background-color: var(--bg-page);
      color: var(--text-main);
      line-height: 1.5;
      font-size: 15px;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    a { color: inherit; text-decoration: none; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 14px;
      font-size: 14px;
      font-weight: 500;
      border-radius: var(--radius-md);
      border: 1px solid transparent;
      cursor: pointer;
      transition: all var(--transition);
      font-family: inherit;
      white-space: nowrap;
    }
    .btn-primary { background-color: var(--primary); color: #ffffff; }
    .btn-primary:hover { background-color: var(--primary-hover); }
    .btn-secondary { background-color: var(--bg-surface); color: var(--text-main); border-color: var(--border-color); }
    .btn-secondary:hover { background-color: var(--bg-muted); }
    .btn-subtle { background-color: transparent; color: var(--text-muted); border: 1px solid var(--border-color); font-size: 13px; padding: 6px 12px; }
    .btn-subtle-sm { background-color: var(--bg-surface); color: var(--text-main); border: 1px solid var(--border-color); font-size: 12px; padding: 4px 10px; border-radius: var(--radius-sm); cursor: pointer; }
    .btn-icon { background: transparent; border: 1px solid var(--border-color); border-radius: var(--radius-sm); padding: 6px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
    .btn-icon:hover { background-color: var(--bg-muted); }
    .site-header { background-color: var(--bg-surface); border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 20; }
    .header-container { max-width: 1040px; margin: 0 auto; padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; }
    .brand-link { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; font-size: 18px; }
    .header-actions { display: flex; align-items: center; gap: 10px; }
    .sheet-status-dot { width: 8px; height: 8px; border-radius: 50%; background-color: #22c55e; display: inline-block; }
    .main-container { max-width: 1040px; margin: 0 auto; padding: 24px 20px 48px; width: 100%; flex: 1; }
    .filters-bar { background-color: var(--bg-surface); border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: 14px 18px; margin-bottom: 24px; display: flex; align-items: center; gap: 18px; flex-wrap: wrap; box-shadow: var(--shadow-sm); }
    .filter-group { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--text-muted); }
    .filter-group select, .modal-form select, .modal-form input { font-family: inherit; font-size: 14px; color: var(--text-main); background-color: var(--bg-page); border: 1px solid var(--border-color); border-radius: var(--radius-sm); padding: 7px 12px; outline: none; }
    .filter-status-info { margin-left: auto; }
    .class-badge { background-color: var(--bg-muted); padding: 4px 10px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 600; }
    .content-grid { display: grid; grid-template-columns: 1.15fr 1fr; gap: 24px; align-items: start; }
    .calendar-card, .notes-card { background-color: var(--bg-surface); border: 1px solid var(--border-color); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); padding: 20px; }
    .calendar-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
    .month-year-title { font-size: 18px; font-weight: 700; }
    .calendar-nav { display: flex; align-items: center; gap: 6px; }
    .calendar-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 12px; font-weight: 600; color: var(--text-muted); padding-bottom: 6px; border-bottom: 1px solid var(--border-color); margin-bottom: 8px; }
    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .cal-day-cell { aspect-ratio: 1 / 1; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; background: transparent; border: 1px solid transparent; border-radius: var(--radius-sm); cursor: pointer; transition: all var(--transition); font-family: inherit; }
    .cal-day-cell:hover { background-color: var(--bg-muted); }
    .cal-day-number { font-size: 14px; font-weight: 500; }
    .cal-day-cell.is-selected { background-color: var(--primary) !important; color: #fff !important; }
    .cal-day-cell.is-selected .cal-day-number { color: #fff; font-weight: 700; }
    .cal-day-cell.is-selected .cal-has-notes-dot { background-color: #fff !important; }
    .cal-has-notes-dot { width: 5px; height: 5px; background-color: var(--accent-dot); border-radius: 50%; margin-top: 4px; }
    .calendar-footer { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--border-color); font-size: 12px; color: var(--text-muted); display: flex; align-items: center; gap: 6px; }
    .notes-card { min-height: 380px; }
    .notes-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 20px; padding-bottom: 14px; border-bottom: 1px solid var(--border-color); }
    .selected-date-title { font-size: 20px; font-weight: 700; }
    .notes-count-badge { background-color: var(--bg-muted); font-size: 12px; font-weight: 600; padding: 4px 9px; border-radius: 20px; }
    .notes-list-container { display: flex; flex-direction: column; gap: 20px; }
    .course-group { display: flex; flex-direction: column; gap: 10px; }
    .course-title { font-size: 15px; font-weight: 700; }
    .topics-container { display: flex; flex-direction: column; gap: 10px; padding-left: 10px; border-left: 2px solid var(--border-color); }
    .topic-title { font-size: 13px; font-weight: 600; color: var(--text-muted); }
    .notes-items-list { display: flex; flex-wrap: wrap; gap: 8px; padding-left: 14px; }
    .note-link-item { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; background-color: var(--bg-surface); border: 1px solid var(--border-color); border-radius: var(--radius-sm); font-size: 13px; font-weight: 500; }
    .note-link-item:hover { background-color: var(--bg-muted); border-color: #cbd5e1; }
    .notes-empty-state { text-align: center; padding: 48px 16px; color: var(--text-muted); margin: auto 0; }
    .modal-backdrop { position: fixed; inset: 0; background-color: rgba(15, 23, 42, 0.45); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 50; opacity: 0; visibility: hidden; transition: 0.2s ease; }
    .modal-backdrop.is-active { opacity: 1; visibility: visible; }
    .modal-card { background: #fff; border-radius: var(--radius-lg); width: 100%; max-width: 500px; padding: 24px; box-shadow: var(--shadow-lg); }
    .modal-header { display: flex; justify-content: space-between; margin-bottom: 16px; }
    .modal-form { display: flex; flex-direction: column; gap: 12px; }
    .form-group { display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px; }
    .btn-close { background: none; border: none; font-size: 20px; cursor: pointer; }
    @media (max-width: 820px) { .content-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <div class="header-container">
      <div class="brand">
        <a href="./" class="brand-link">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
          </svg>
          <span id="site-title">ClassNotes</span>
        </a>
      </div>
      <div class="header-actions">
        <button id="open-setup-btn" class="btn btn-subtle">
          <span class="sheet-status-dot"></span>
          <span>Google Sheet: Connected</span>
        </button>
        <button id="open-add-modal-btn" class="btn btn-primary">+ Add Note</button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main-container">
    <section class="filters-bar">
      <div class="filter-group">
        <label for="dept-select">Department:</label>
        <select id="dept-select"></select>
      </div>
      <div class="filter-group">
        <label for="section-select">Section:</label>
        <select id="section-select"></select>
      </div>
      <div class="filter-status-info">
        <span id="current-class-badge" class="class-badge">Loading...</span>
      </div>
    </section>

    <div class="content-grid">
      <!-- Calendar -->
      <section class="calendar-section">
        <div class="calendar-card">
          <div class="calendar-header">
            <h2 id="calendar-month-year" class="month-year-title">September 2026</h2>
            <div class="calendar-nav">
              <button id="cal-prev-month" class="btn-icon">&lt;</button>
              <button id="cal-today-btn" class="btn-subtle-sm">Today</button>
              <button id="cal-next-month" class="btn-icon">&gt;</button>
            </div>
          </div>
          <div class="calendar-weekdays">
            <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
          </div>
          <div id="calendar-days-grid" class="calendar-grid"></div>
          <div class="calendar-footer">
            <span class="cal-has-notes-dot"></span> Dates with approved notes
          </div>
        </div>
      </section>

      <!-- Notes Display -->
      <section class="notes-section">
        <div class="notes-card">
          <div class="notes-header">
            <div>
              <span style="font-size: 12px; color: var(--text-muted); text-transform: uppercase; font-weight: 600;">Selected Date</span>
              <h3 id="selected-date-display" class="selected-date-title">22 September 2026</h3>
            </div>
            <div id="notes-count-badge" class="notes-count-badge">0 notes</div>
          </div>
          <div id="notes-list-container" class="notes-list-container"></div>
        </div>
      </section>
    </div>
  </main>

  <!-- Add Note Modal -->
  <div id="add-note-modal" class="modal-backdrop">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Add Note</h3>
        <button id="close-add-modal-btn" class="btn-close">&times;</button>
      </div>
      <form id="add-note-form" class="modal-form">
        <div class="form-group">
          <label>Department:</label>
          <select id="form-dept" required></select>
        </div>
        <div class="form-group">
          <label>Section:</label>
          <select id="form-section" required></select>
        </div>
        <div class="form-group">
          <label>Date:</label>
          <input type="date" id="form-date" required>
        </div>
        <div class="form-group">
          <label>Course Name:</label>
          <select id="form-course" required></select>
        </div>
        <div class="form-group">
          <label>Topic Name:</label>
          <input type="text" id="form-topic" placeholder="e.g. Number System" required>
        </div>
        <div class="form-group">
          <label>Note Title:</label>
          <input type="text" id="form-title" placeholder="e.g. Board Note" required>
        </div>
        <div class="form-group">
          <label>Note Link:</label>
          <input type="url" id="form-link" placeholder="Google Drive Link">
        </div>
        <div id="form-message" style="display:none; padding: 10px; border-radius: 4px; font-size: 13px;"></div>
        <div class="modal-actions">
          <button type="button" id="cancel-add-btn" class="btn btn-secondary">Cancel</button>
          <button type="submit" id="submit-note-btn" class="btn btn-primary">Submit Note</button>
        </div>
      </form>
    </div>
  </div>

  <script>
  (function() {
    "use strict";

    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw3aWwV--qQQMyplo3GnTexrnbTaGb5p_I-twV-fK4mokGSIA2PkOHQ7L9Ye05fv55T/exec";

    const CONFIG = {
      departments: [
        {
          code: "CSE",
          name: "Computer Science & Engineering",
          sections: ["73_L", "73_A", "73_B", "72_C", "71_A"],
          courses: ["CSE Fundamentals", "Data Structures & Algorithms", "Database Management Systems", "Computer Networks", "English"]
        },
        {
          code: "EEE",
          name: "Electrical & Electronic Engineering",
          sections: ["65_A", "65_B"],
          courses: ["Circuit Analysis", "Signals & Systems", "Digital Electronics"]
        },
        {
          code: "BBA",
          name: "Business Administration",
          sections: ["42_B", "42_A"],
          courses: ["Principles of Marketing", "Financial Accounting"]
        }
      ]
    };

    const MONTH_NAMES = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

    const state = {
      department: "CSE",
      section: "73_L",
      viewYear: 2026,
      viewMonth: 8, // September
      selectedDateKey: "2026-09-22",
      approvedNotes: []
    };

    const $ = id => document.getElementById(id);

    // তারিখকে স্ট্যান্ডার্ড YYYY-MM-DD ফরম্যাটে রূপান্তর
    function normalizeDateToKey(val) {
      if (!val) return "";
      const d = new Date(val);
      if (isNaN(d.getTime())) return String(val).trim();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    }

    // সহজে পাঠযোগ্য ফরম্যাটে তারিখ দেখানো
    function formatDisplayDate(dateKey) {
      if (!dateKey) return "";
      const d = new Date(dateKey + "T00:00:00");
      return isNaN(d.getTime()) ? dateKey : `${d.getDate()} ${MONTH_NAMES[d.getMonth()]} ${d.getFullYear()}`;
    }

    async function initApp() {
      CONFIG.departments.forEach(d => {
        const text = `${d.code} — ${d.name}`;
        $("dept-select").add(new Option(text, d.code));
        $("form-dept").add(new Option(text, d.code));
      });

      $("dept-select").value = state.department;
      updateSectionSelect(state.department);
      $("section-select").value = state.section;

      setupEvents();
      await fetchNotesFromSheet();
      autoFocusNotes();
      updateView();
    }

    function updateSectionSelect(deptCode) {
      const dept = CONFIG.departments.find(d => d.code === deptCode);
      $("section-select").innerHTML = "";
      (dept?.sections || []).forEach(s => $("section-select").add(new Option(`Section ${s}`, s)));
    }

    function updateModalDropdowns(deptCode) {
      const dept = CONFIG.departments.find(d => d.code === deptCode);
      $("form-section").innerHTML = "";
      (dept?.sections || []).forEach(s => $("form-section").add(new Option(`Section ${s}`, s)));
      $("form-course").innerHTML = "";
      (dept?.courses || []).forEach(c => $("form-course").add(new Option(c, c)));
    }

    async function fetchNotesFromSheet() {
      try {
        const res = await fetch(SCRIPT_URL);
        const data = await res.json();
        if (data?.success && Array.isArray(data.notes)) {
          state.approvedNotes = data.notes.map(n => ({
            department: String(n.department || "").trim(),
            section: String(n.section || "").trim(),
            date: normalizeDateToKey(n.date),
            course: String(n.course || "").trim(),
            topic: String(n.topic || "").trim(),
            title: String(n.title || "").trim(),
            link: String(n.link || "").trim(),
            status: String(n.status || "Approved").trim()
          }));
        }
      } catch (err) {
        console.error("Error fetching notes:", err);
      }
    }

    function getCurrentClassNotes() {
      return state.approvedNotes.filter(n =>
        n.department.toLowerCase() === state.department.toLowerCase() &&
        n.section.toLowerCase() === state.section.toLowerCase() &&
        n.status.toLowerCase() === "approved"
      );
    }

    function autoFocusNotes() {
      const matching = getCurrentClassNotes();
      if (matching.length > 0) {
        const d = new Date(matching[0].date + "T00:00:00");
        if (!isNaN(d.getTime())) {
          state.viewYear = d.getFullYear();
          state.viewMonth = d.getMonth();
          state.selectedDateKey = matching[0].date;
        }
      }
    }

    // ক্যালেন্ডার, ব্যাজ ও নোট লিস্ট একসাথে আপডেট করা
    function updateView() {
      $("current-class-badge").textContent = `${state.department} • Section ${state.section}`;
      renderCalendar();
      renderNotes();
    }

    function renderCalendar() {
      const y = state.viewYear;
      const m = state.viewMonth;
      $("calendar-month-year").textContent = `${MONTH_NAMES[m]} ${y}`;
      $("calendar-days-grid").innerHTML = "";

      const firstDay = new Date(y, m, 1).getDay();
      const daysInMonth = new Date(y, m + 1, 0).getDate();
      const noteDates = new Set(getCurrentClassNotes().map(n => n.date));

      // আগের মাসের ফাঁকা সেলগুলোর জন্য খালি div
      for (let i = 0; i < firstDay; i++) {
        const emptyCell = document.createElement("div");
        emptyCell.className = "cal-day-cell";
        $("calendar-days-grid").appendChild(emptyCell);
      }

      // চলতি মাসের দিনগুলো
      for (let d = 1; d <= daysInMonth; d++) {
        const key = `${y}-${String(m + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
        const hasNotes = noteDates.has(key);
        const cell = document.createElement("button");
        cell.className = `cal-day-cell${key === state.selectedDateKey ? " is-selected" : ""}`;
        cell.innerHTML = `<span class="cal-day-number">${d}</span>${hasNotes ? `<span class="cal-has-notes-dot"></span>` : ""}`;
        cell.onclick = () => {
          state.selectedDateKey = key;
          renderCalendar();
          renderNotes();
        };
        $("calendar-days-grid").appendChild(cell);
      }
    }

    function renderNotes() {
      $("selected-date-display").textContent = formatDisplayDate(state.selectedDateKey);
      const notes = getCurrentClassNotes().filter(n => n.date === state.selectedDateKey);

      $("notes-count-badge").textContent = `${notes.length} notes`;

      if (notes.length === 0) {
        $("notes-list-container").innerHTML = `<div class="notes-empty-state"><p>No notes for this date.</p></div>`;
        return;
      }

      const grouped = {};
      notes.forEach(n => {
        if (!grouped[n.course]) grouped[n.course] = {};
        if (!grouped[n.course][n.topic]) grouped[n.course][n.topic] = [];
        grouped[n.course][n.topic].push(n);
      });

      $("notes-list-container").innerHTML = Object.entries(grouped).map(([course, topics]) => `
        <div class="course-group">
          <h4 class="course-title">${course}</h4>
          <div class="topics-container">
            ${Object.entries(topics).map(([topic, items]) => `
              <div>
                <div class="topic-title">&rarr; ${topic}</div>
                <div class="notes-items-list">
                  ${items.map(item => {
                    const hasLink = Boolean(item.link && item.link.trim());
                    return `<a href="${hasLink ? item.link : 'javascript:void(0)'}" ${hasLink ? 'target="_blank" rel="noopener"' : ''} class="note-link-item">${item.title} ↗</a>`;
                  }).join("")}
                </div>
              </div>
            `).join("")}
          </div>
        </div>
      `).join("");
    }

    function setupEvents() {
      $("dept-select").onchange = (e) => {
        state.department = e.target.value;
        updateSectionSelect(state.department);
        state.section = $("section-select").value;
        autoFocusNotes();
        updateView();
      };

      $("section-select").onchange = (e) => {
        state.section = e.target.value;
        autoFocusNotes();
        updateView();
      };

      $("cal-prev-month").onclick = () => {
        if (state.viewMonth === 0) { state.viewMonth = 11; state.viewYear--; }
        else { state.viewMonth--; }
        renderCalendar();
      };

      $("cal-next-month").onclick = () => {
        if (state.viewMonth === 11) { state.viewMonth = 0; state.viewYear++; }
        else { state.viewMonth++; }
        renderCalendar();
      };

      $("cal-today-btn").onclick = () => {
        autoFocusNotes();
        updateView();
      };

      $("open-add-modal-btn").onclick = () => {
        $("form-dept").value = state.department;
        updateModalDropdowns(state.department);
        $("form-date").value = state.selectedDateKey;
        $("add-note-modal").classList.add("is-active");
      };

      $("close-add-modal-btn").onclick = $("cancel-add-btn").onclick = () => {
        $("add-note-modal").classList.remove("is-active");
      };

      $("form-dept").onchange = (e) => updateModalDropdowns(e.target.value);

      $("add-note-form").onsubmit = async (e) => {
        e.preventDefault();
        const payload = {
          department: $("form-dept").value,
          section: $("form-section").value,
          date: $("form-date").value,
          course: $("form-course").value,
          topic: $("form-topic").value,
          title: $("form-title").value,
          link: $("form-link").value || ""
        };

        const msg = $("form-message");
        msg.style.display = "block";
        msg.style.background = "#eff6ff";
        msg.style.color = "#1d4ed8";
        msg.innerHTML = "Submitting note to Google Sheets...";

        try {
          await fetch(SCRIPT_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify(payload)
          });
          msg.style.background = "#f0fdf4";
          msg.style.color = "#16a34a";
          msg.innerHTML = "✓ Note submitted with Pending status! Once approved in Google Sheet, it will appear.";
          setTimeout(() => {
            $("add-note-modal").classList.remove("is-active");
            msg.style.display = "none";
          }, 3000);
        } catch(err) {
          msg.innerHTML = "✓ Submitted! Please check Google Sheets.";
        }
      };
    }

    window.addEventListener("DOMContentLoaded", initApp);
  })();
  </script>
</body>
</html>
