<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClassNotes — Organized Lecture Notes</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-canvas: #F4EFE6;
      --bg-surface: #FFFFFF;
      --bg-subtle: #EAE4D9;
      --bg-hover: #E2DBD0;
      --bg-pill: #ECE6DB;

      --bg-has-notes: #FDE68A;
      --bg-has-notes-hover: #FCD34D;
      --border-has-notes: #F59E0B;
      --text-has-notes: #78350F;

      --border-subtle: #E5DFD3;
      --border-control: #DFD7CA;

      --text-main: #181716;
      --text-muted: #3C3833;
      --text-subtle: #8A847A;
      --text-disabled: #B8B0A5;

      --brand-primary: #0A37F5;
      --brand-primary-hover: #072CC4;
      --brand-dark: #181716;
      --brand-dark-hover: #2B2A28;
      --brand-danger: #DC2626;
      --brand-success: #16A34A;

      --radius-full: 9999px;
      --radius-lg: 16px;
      --radius-md: 10px;

      --font-display: 'Instrument Serif', Georgia, serif;
      --font-body: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-canvas);
      color: var(--text-main);
      font-family: var(--font-body);
      font-size: 15px;
      line-height: 1.5;
      min-height: 100vh;
      padding-bottom: 4rem;
    }

    .shell {
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      padding: 0 clamp(1rem, 4vw, 2.5rem);
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      position: relative;
      font: inherit;
      font-size: 0.875rem;
      font-weight: 600;
      padding: 0.625rem 1.25rem;
      border: 1px solid transparent;
      border-radius: var(--radius-full);
      cursor: pointer;
      text-decoration: none;
      white-space: nowrap;
      transition: background-color 0.15s ease, opacity 0.15s ease, border-color 0.15s ease;
    }

    .btn:disabled {
      cursor: not-allowed;
      opacity: 0.6;
    }

    .btn.is-loading {
      pointer-events: none;
      color: transparent !important;
    }

    .btn.is-loading::after {
      content: '';
      position: absolute;
      width: 1rem;
      height: 1rem;
      border: 2px solid #FFFFFF;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }

    .btn--primary {
      background-color: var(--brand-primary);
      color: #FFFFFF;
    }
    .btn--primary:hover:not(:disabled) {
      background-color: var(--brand-primary-hover);
    }

    .btn--dark {
      background-color: var(--brand-dark);
      color: #FFFFFF;
      padding: 0.5rem 1.15rem;
      font-size: 0.8125rem;
    }
    .btn--dark:hover:not(:disabled) {
      background-color: var(--brand-dark-hover);
    }

    .btn--ghost {
      background-color: var(--bg-subtle);
      color: var(--text-main);
    }
    .btn--ghost:hover:not(:disabled) {
      background-color: var(--bg-hover);
    }

    .btn--subtle {
      background-color: var(--bg-canvas);
      color: var(--text-main);
      border-color: #DFD8CC;
      padding: 0.5rem 1rem;
      font-size: 0.8125rem;
      gap: 0.4rem;
    }
    .btn--subtle:hover:not(:disabled) {
      background-color: #EAE3D5;
    }

    .btn--danger {
      background-color: var(--brand-danger);
      color: #FFFFFF;
    }

    /* Badges */
    .badge {
      display: inline-flex;
      align-items: center;
      background: var(--bg-subtle);
      color: var(--text-main);
      font-family: var(--font-display);
      font-style: italic;
      border-radius: var(--radius-full);
      padding: 0.2rem 0.8rem;
    }

    .hero__title .badge {
      background-color: var(--bg-has-notes);
    }

    /* Form Fields & Inputs */
    .field {
      margin-bottom: 1rem;
    }

    .field label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-subtle);
      margin-bottom: 0.35rem;
    }

    .field input,
    .field select,
    .filter-bar__select {
      background-color: var(--bg-subtle);
      border: 1px solid transparent;
      border-radius: var(--radius-md);
      padding: 0.75rem 1rem;
      font: inherit;
      font-size: 0.9375rem;
      color: var(--text-main);
      transition: background-color 0.15s ease;
      width: 100%;
    }

    .field input:focus,
    .field select:focus,
    .filter-bar__select:focus {
      outline: none;
      background-color: var(--bg-hover);
    }

    .select-arrow {
      cursor: pointer;
      appearance: none;
      background-image: url("data:image/svg+xml,%3Csvg width='12' height='8' viewBox='0 0 12 8' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1.5 1.75L6 6.25L10.5 1.75' stroke='%236E6961' stroke-width='1.75' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
      background-repeat: no-repeat;
      background-position: right 1rem center;
    }

    /* Site Header */
    .site-header {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.5rem clamp(1rem, 4vw, 3.5rem);
      background: var(--bg-canvas);
    }

    .brand-mark {
      font-family: var(--font-display);
      font-style: italic;
      font-size: 1.875rem;
      letter-spacing: -0.02em;
      line-height: 1;
    }

    .brand-mark sup {
      font-size: 0.75rem;
      font-family: var(--font-body);
      font-style: normal;
      color: var(--text-subtle);
      font-weight: 600;
      margin-left: 2px;
    }

    /* Hero */
    .hero {
      padding: 3rem 1rem 1.75rem;
      text-align: center;
      max-width: 760px;
      margin: 0 auto;
    }

    .hero__title {
      font-family: var(--font-display);
      font-size: clamp(2.25rem, 4vw, 3.75rem);
      font-weight: 400;
      line-height: 1.15;
      letter-spacing: -0.02em;
      margin-bottom: 0.85rem;
    }

    .hero__desc {
      font-size: 1rem;
      color: var(--text-muted);
      max-width: 520px;
      margin: 0 auto;
    }

    /* Filters */
    .filter-bar {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 0.85rem 1.5rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.85rem;
      margin-top: 1rem;
    }

    .filter-bar__group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .filter-bar__label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 600;
      color: var(--text-subtle);
      white-space: nowrap;
    }

    .filter-bar__select {
      font-size: 0.875rem;
      font-weight: 600;
      border-radius: var(--radius-full);
      padding: 0.5rem 2rem 0.5rem 1rem;
      background-position: right 0.85rem center;
      width: auto;
      min-width: 135px;
    }

    .filter-bar__badge {
      margin-left: auto;
      font-size: 1.05rem;
    }

    .content-area {
      margin-top: 1.5rem;
    }

    /* Calendar */
    .calendar-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.85rem;
      padding-bottom: 0.85rem;
      border-bottom: 1px solid var(--border-subtle);
      flex-wrap: wrap;
      gap: 1rem;
    }

    .calendar-nav__title {
      font-family: var(--font-display);
      font-size: 2.75rem;
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1;
    }

    .calendar-nav__actions {
      display: flex;
      align-items: center;
      gap: 0.45rem;
    }

    .calendar-grid {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0 0.85rem;
      table-layout: fixed;
    }

    .calendar-grid th {
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--text-muted);
      padding-bottom: 0.75rem;
      text-align: center;
    }

    .calendar-cell {
      height: 56px;
      text-align: center;
      vertical-align: middle;
    }

    .calendar-cell__btn {
      width: 48px;
      height: 48px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--bg-pill);
      border: 1px solid var(--border-control);
      font: inherit;
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--text-main);
      border-radius: 50%;
      cursor: pointer;
      transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    }

    .calendar-cell__btn:hover:not(:disabled) {
      background-color: var(--bg-hover);
      border-color: #D2C8B8;
    }

    .calendar-cell.has-notes .calendar-cell__btn {
      background-color: var(--bg-has-notes);
      border-color: var(--border-has-notes);
      color: var(--text-has-notes);
      font-weight: 700;
    }

    .calendar-cell.has-notes .calendar-cell__btn:hover:not(:disabled) {
      background-color: var(--bg-has-notes-hover);
    }

    .calendar-cell--today .calendar-cell__btn {
      border: 2px solid var(--text-main);
      font-weight: 700;
    }

    .calendar-cell--disabled .calendar-cell__btn {
      background: transparent !important;
      border: none !important;
      color: var(--text-disabled) !important;
      opacity: 0.4;
      cursor: default;
      pointer-events: none;
    }

    /* Course & Topic Cards View */
    .course-dates__header {
      display: flex;
      align-items: baseline;
      gap: 0.75rem;
      margin-bottom: 1.25rem;
      padding-bottom: 0.85rem;
      border-bottom: 1px solid var(--border-subtle);
      flex-wrap: wrap;
    }

    .course-dates__title {
      font-family: var(--font-display);
      font-size: 2.25rem;
      font-weight: 400;
      line-height: 1.1;
    }

    .course-dates__count {
      font-size: 0.875rem;
      color: var(--text-subtle);
      font-weight: 600;
    }

    .course-dates__grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 0.85rem;
      width: 100%;
    }

    .course-card {
      background-color: var(--bg-pill);
      border: 1px solid var(--border-control);
      border-radius: var(--radius-md);
      padding: 0.95rem 1.15rem;
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.75rem;
      transition: background-color 0.15s ease, border-color 0.15s ease;
      text-align: left;
    }

    .course-card:hover {
      background-color: var(--bg-hover);
      border-color: #D2C8B8;
    }

    .course-card__info {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .course-card__date {
      font-weight: 600;
      font-size: 0.95rem;
      line-height: 1.3;
    }

    .course-card__day {
      font-size: 0.8125rem;
      color: var(--text-subtle);
      font-weight: 500;
    }

    .course-card__badge {
      align-self: flex-start;
      background-color: var(--bg-subtle);
      border: 1px solid #D8D0C3;
      color: var(--text-muted);
      padding: 0.2rem 0.65rem;
      border-radius: var(--radius-full);
      font-size: 0.75rem;
      font-weight: 600;
      white-space: nowrap;
    }

    /* Native Modal Dialogs */
    .dialog-modal {
      position: fixed;
      inset: 0;
      margin: auto;
      max-width: 500px;
      width: calc(100% - 2rem);
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 2rem;
      color: var(--text-main);
    }

    .dialog-modal::backdrop {
      background: rgba(24, 23, 22, 0.45);
      backdrop-filter: blur(6px);
    }

    .dialog-modal__header {
      padding-bottom: 0.85rem;
      border-bottom: 1px solid var(--border-subtle);
    }

    .dialog-modal__title {
      font-family: var(--font-display);
      font-size: 1.75rem;
      font-weight: 400;
      letter-spacing: -0.02em;
      margin-bottom: 0.2rem;
    }

    .dialog-modal__desc {
      font-size: 0.8125rem;
      color: var(--text-subtle);
      font-weight: 600;
    }

    .dialog-modal__actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 0.75rem;
      margin-top: 1.5rem;
    }

    .notes-stack {
      max-height: 52vh;
      overflow-y: auto;
      margin-top: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 3.5rem 1.5rem;
      gap: 0.85rem;
      width: 100%;
      grid-column: 1 / -1;
    }

    .empty-state__icon {
      width: 44px;
      height: 44px;
      color: var(--text-subtle);
      opacity: 0.75;
    }

    .empty-state__text {
      font-size: 0.9375rem;
      color: var(--text-subtle);
      font-weight: 500;
      max-width: 420px;
      line-height: 1.45;
    }

    .note-cluster {
      background-color: #FAF6EF;
      border-radius: var(--radius-md);
      padding: 0.95rem 1.15rem;
    }

    .note-cluster__course {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 0.4rem;
    }

    .note-cluster__topic-group {
      margin: 0.45rem 0 0.65rem 1.1rem;
    }

    .note-cluster__topic-group:last-child {
      margin-bottom: 0;
    }

    .note-cluster__topic-header {
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 0.35rem;
    }

    .note-cluster__list {
      list-style: none;
      margin-left: 1.1rem;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .note-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 0.15rem 0;
    }

    .note-row__left {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      font-size: 0.9rem;
    }

    .note-row__icon {
      width: 14px;
      height: 14px;
      color: var(--text-subtle);
      flex-shrink: 0;
    }

    .note-row__link {
      color: var(--brand-primary);
      text-decoration: none;
      font-weight: 500;
    }

    .note-row__link:hover {
      text-decoration: underline;
    }

    .note-row__plain {
      font-weight: 500;
    }

    .note-row__flag {
      color: var(--brand-danger);
      font-weight: 600;
      font-size: 0.72rem;
      margin-left: 0.25rem;
    }

    .btn-report {
      background: transparent;
      border: none;
      color: var(--text-subtle);
      font-size: 0.75rem;
      font-weight: 500;
      cursor: pointer;
      text-decoration: underline;
      padding: 0.1rem 0.25rem;
    }

    .btn-report:hover {
      color: var(--brand-danger);
    }

    /* Toast */
    .toast-tray {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      pointer-events: none;
    }

    .toast {
      pointer-events: auto;
      background: var(--brand-dark);
      color: #FFFFFF;
      padding: 0.75rem 1.25rem;
      border-radius: var(--radius-md);
      font-size: 0.875rem;
      font-weight: 500;
      transition: opacity 0.25s ease;
      border-left: 4px solid var(--brand-success);
    }

    .toast--error {
      border-left-color: var(--brand-danger);
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 768px) {
      .site-header { padding: 1.25rem 1rem; }
      .hero { padding: 2rem 1rem 1.25rem; }
      .filter-bar { padding: 1rem; }
      .filter-bar__group { width: 100%; justify-content: space-between; }
      .filter-bar__select { flex: 1; min-width: 0; }
      .filter-bar__badge { margin-left: 0; width: 100%; justify-content: center; }
      .calendar-nav__title { font-size: 2.15rem; }
      .calendar-nav { margin-bottom: 0.65rem; padding-bottom: 0.65rem; }
      .calendar-grid { border-spacing: 0 0.4rem; }
      .calendar-cell { height: 46px; }
      .calendar-cell__btn { width: 38px; height: 38px; font-size: 0.8125rem; }
      .dialog-modal { padding: 1.5rem 1.25rem; }
      .toast-tray { left: 1rem; right: 1rem; bottom: 1rem; }
    }
  </style>
</head>
<body>

  <header class="site-header">
    <h1 class="brand-mark">ClassNotes<sup>®</sup></h1>
    <button type="button" class="btn btn--primary" id="trigger-add-note">+ Add Note</button>
  </header>

  <div class="shell">
    <section class="hero">
      <h2 class="hero__title">Lecture archive &amp; <span class="badge">class notes</span></h2>
      <p class="hero__desc">Browse lecture slides, handouts, and shared class resources organized by section date.</p>
    </section>

    <!-- Filters -->
    <section class="filter-bar">
      <div class="filter-bar__group">
        <label class="filter-bar__label" for="dept-select">Department:</label>
        <select class="filter-bar__select select-arrow" id="dept-select"></select>
      </div>

      <div class="filter-bar__group">
        <label class="filter-bar__label" for="section-select">Section:</label>
        <select class="filter-bar__select select-arrow" id="section-select"></select>
      </div>

      <div class="filter-bar__group">
        <label class="filter-bar__label" for="course-select">Course:</label>
        <select class="filter-bar__select select-arrow" id="course-select"></select>
      </div>

      <div class="filter-bar__group">
        <label class="filter-bar__label" for="topic-select">Topic:</label>
        <select class="filter-bar__select select-arrow" id="topic-select">
          <option value="ALL">All Topics</option>
        </select>
      </div>

      <strong class="badge filter-bar__badge" id="class-badge"></strong>
    </section>

    <main class="content-area">
      <!-- Calendar View: Only shown when Course is ALL and Topic is ALL -->
      <section id="calendar-view">
        <div class="calendar-nav">
          <h2 class="calendar-nav__title" id="calendar-header-title"></h2>
          <div class="calendar-nav__actions">
            <button type="button" class="btn btn--subtle" id="cal-prev" aria-label="Previous Month">
              <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M10 13L5 8L10 3"/>
              </svg>
              <span>Prev</span>
            </button>
            <button type="button" class="btn btn--dark" id="cal-today">Today</button>
            <button type="button" class="btn btn--subtle" id="cal-next" aria-label="Next Month">
              <span>Next</span>
              <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M6 3L11 8L6 13"/>
              </svg>
            </button>
          </div>
        </div>

        <table class="calendar-grid">
          <thead>
            <tr>
              <th>Sun</th><th>Mon</th><th>Tue</th><th>Wed</th><th>Thu</th><th>Fri</th><th>Sat</th>
            </tr>
          </thead>
          <tbody id="calendar-cells"></tbody>
        </table>
      </section>

      <!-- Filtered View: Card grid shown when Course or Topic is filtered -->
      <section class="course-dates-view" id="course-view" hidden>
        <div class="course-dates__header">
          <h3 class="course-dates__title" id="course-view-title"></h3>
          <span class="course-dates__count" id="course-view-count"></span>
        </div>
        <div class="course-dates__grid" id="course-dates-list"></div>
      </section>
    </main>

    <!-- Notes View Dialog -->
    <dialog class="dialog-modal" id="notes-modal">
      <div class="dialog-modal__header">
        <h3 class="dialog-modal__title" id="modal-date-label"></h3>
        <span class="dialog-modal__desc" id="modal-notes-total"></span>
      </div>
      <div class="notes-stack" id="modal-notes-stack"></div>
      <form method="dialog" class="dialog-modal__actions">
        <button type="submit" class="btn btn--ghost">Close</button>
      </form>
    </dialog>

    <!-- Add Note Dialog -->
    <dialog class="dialog-modal" id="add-modal">
      <form id="add-note-form">
        <h3 class="dialog-modal__title">Add Class Note</h3>

        <div class="field">
          <label for="input-dept">Department:</label>
          <select id="input-dept" class="select-arrow" required></select>
        </div>

        <div class="field">
          <label for="input-section">Section:</label>
          <select id="input-section" class="select-arrow" required></select>
        </div>

        <div class="field">
          <label for="input-date">Date:</label>
          <input type="date" id="input-date" required>
        </div>

        <div class="field">
          <label for="input-course">Course:</label>
          <select id="input-course" class="select-arrow" required></select>
        </div>

        <div class="field">
          <label for="input-topic">Topic:</label>
          <input type="text" id="input-topic" placeholder="e.g. Graph Traversal Algorithms" required>
        </div>

        <div class="field">
          <label for="input-title">Title:</label>
          <input type="text" id="input-title" placeholder="e.g. Lecture Slide 12" required>
        </div>

        <div class="field">
          <label for="input-link">Resource URL:</label>
          <input type="text" id="input-link" inputmode="url" placeholder="https://... (Drive, Notion, OneDrive, etc.)">
        </div>

        <div class="dialog-modal__actions">
          <button type="button" class="btn btn--ghost" id="btn-cancel-add">Cancel</button>
          <button type="submit" class="btn btn--primary" id="btn-submit-note">Submit Note</button>
        </div>
      </form>
    </dialog>

    <!-- Report Link Dialog -->
    <dialog class="dialog-modal" id="report-modal">
      <form id="report-link-form">
        <h3 class="dialog-modal__title">Report Broken Link</h3>
        <p class="field">
          <strong>Resource:</strong> <span id="report-note-title"></span><br>
          <small id="report-note-context" class="dialog-modal__desc"></small>
        </p>
        <p class="field" style="font-size: 0.875rem; color: var(--text-muted);">
          Flagging this note notifies section classmates that the link is expired or inaccessible.
        </p>
        <div class="dialog-modal__actions">
          <button type="button" class="btn btn--ghost" id="btn-cancel-report">Cancel</button>
          <button type="submit" class="btn btn--danger" id="btn-submit-report">Report Link</button>
        </div>
      </form>
    </dialog>
  </div>

  <div class="toast-tray" id="toast-tray" aria-live="polite"></div>

  <script src="config.js"></script>

  <script>
    (function () {
      "use strict";

      const config = window.APP_CONFIG || {
        googleAppsScriptUrl: "",
        departments: [
          {
            code: "CSE",
            sections: ["73_A", "73_B", "73_L"],
            courses: ["CSE Fundamentals", "CSE101", "CSE102", "CSE103"]
          }
        ]
      };

      const MONTHS = [
        "January", "February", "March", "April", "May", "June",
        "July", "August", "September", "October", "November", "December"
      ];
      const DAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

      const today = new Date();
      const state = {
        dept: config.departments[0]?.code || "CSE",
        sec: config.departments[0]?.sections.includes("73_L") ? "73_L" : (config.departments[0]?.sections[0] || ""),
        course: "ALL",
        topic: "ALL",
        viewDate: new Date(today.getFullYear(), today.getMonth(), 1),
        activeDate: null,
        notes: [],
        manualTitleEdited: false
      };

      const ui = {
        dept: document.getElementById("dept-select"),
        sec: document.getElementById("section-select"),
        course: document.getElementById("course-select"),
        topic: document.getElementById("topic-select"),
        badge: document.getElementById("class-badge"),

        calendarView: document.getElementById("calendar-view"),
        calendarTitle: document.getElementById("calendar-header-title"),
        calendarCells: document.getElementById("calendar-cells"),
        prevMonthBtn: document.getElementById("cal-prev"),
        todayBtn: document.getElementById("cal-today"),
        nextMonthBtn: document.getElementById("cal-next"),

        courseView: document.getElementById("course-view"),
        courseTitle: document.getElementById("course-view-title"),
        courseCount: document.getElementById("course-view-count"),
        courseDatesList: document.getElementById("course-dates-list"),

        notesModal: document.getElementById("notes-modal"),
        modalDateLabel: document.getElementById("modal-date-label"),
        modalNotesTotal: document.getElementById("modal-notes-total"),
        modalNotesStack: document.getElementById("modal-notes-stack"),

        addModal: document.getElementById("add-modal"),
        addNoteBtn: document.getElementById("trigger-add-note"),
        addForm: document.getElementById("add-note-form"),
        formDept: document.getElementById("input-dept"),
        formSec: document.getElementById("input-section"),
        formDate: document.getElementById("input-date"),
        formCourse: document.getElementById("input-course"),
        formTopic: document.getElementById("input-topic"),
        formTitle: document.getElementById("input-title"),
        formLink: document.getElementById("input-link"),
        btnSubmitNote: document.getElementById("btn-submit-note"),
        btnCancelAdd: document.getElementById("btn-cancel-add"),

        reportModal: document.getElementById("report-modal"),
        reportForm: document.getElementById("report-link-form"),
        reportTitle: document.getElementById("report-note-title"),
        reportContext: document.getElementById("report-note-context"),
        btnSubmitReport: document.getElementById("btn-submit-report"),
        btnCancelReport: document.getElementById("btn-cancel-report"),

        toastTray: document.getElementById("toast-tray")
      };

      // Utility Helpers
      function formatDateKey(d) {
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
      }

      function formatReadableDate(key) {
        if (!key) return "";
        const [y, m, d] = key.split("-");
        return `${parseInt(d, 10)} ${MONTHS[parseInt(m, 10) - 1]} ${y}`;
      }

      function parseLocalDate(key) {
        const [y, m, d] = key.split("-").map(Number);
        return new Date(y, m - 1, d);
      }

      function escapeHtml(str) {
        if (!str) return "";
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function formatLink(url) {
        if (!url) return "";
        const trimmed = String(url).trim();
        if (!trimmed) return "";
        return /^(https?:\/\/|\/\/)/i.test(trimmed) ? trimmed : `https://${trimmed}`;
      }

      function setOptions(el, list, placeholder = "") {
        const prefix = placeholder ? `<option value="ALL">${placeholder}</option>` : "";
        el.innerHTML = prefix + list.map(item => `<option value="${escapeHtml(item)}">${escapeHtml(item)}</option>`).join("");
      }

      function showToast(message, type = "success") {
        const toast = document.createElement("div");
        toast.className = `toast toast--${type}`;
        toast.textContent = message;
        ui.toastTray.appendChild(toast);

        setTimeout(() => {
          toast.style.opacity = "0";
          setTimeout(() => toast.remove(), 250);
        }, 3000);
      }

      function getEmptyState(text) {
        return `
          <div class="empty-state">
            <svg class="empty-state__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
              <line x1="9" y1="13" x2="15" y2="13"></line>
            </svg>
            <p class="empty-state__text">${text}</p>
          </div>
        `;
      }

      function getActiveDept() {
        return config.departments.find(d => d.code === state.dept) || config.departments[0];
      }

      function getApprovedNotes() {
        return state.notes.filter(n =>
          n.department === state.dept &&
          n.section === state.sec &&
          String(n.status || "").toLowerCase() === "approved"
        );
      }

      function syncTopicDropdown() {
        const notes = getApprovedNotes().filter(n =>
          (state.course === "ALL" || n.course === state.course) &&
          n.topic && n.topic.trim() !== ""
        );
        const uniqueTopics = [...new Set(notes.map(n => n.topic.trim()))].sort();
        setOptions(ui.topic, uniqueTopics, "All Topics");

        state.topic = uniqueTopics.includes(state.topic) ? state.topic : "ALL";
        ui.topic.value = state.topic;
      }

      function syncDropdownStates() {
        const dept = getActiveDept();
        if (!dept) return;

        setOptions(ui.sec, dept.sections);
        setOptions(ui.course, dept.courses, "All Courses");
        setOptions(ui.formSec, dept.sections);
        setOptions(ui.formCourse, dept.courses);

        ui.dept.value = state.dept;
        state.sec = dept.sections.includes(state.sec) ? state.sec : dept.sections[0];
        ui.sec.value = state.sec;

        state.course = dept.courses.includes(state.course) || state.course === "ALL" ? state.course : "ALL";
        ui.course.value = state.course;

        syncTopicDropdown();
        syncBadgeText();
      }

      function syncBadgeText() {
        let badge = `[ ${state.dept} | Sec ${state.sec}`;
        if (state.course !== "ALL") badge += ` | ${state.course}`;
        if (state.topic !== "ALL") badge += ` | ${state.topic}`;
        badge += ` ]`;
        ui.badge.textContent = badge;
      }

      function calculateDefaultTitle() {
        if (state.manualTitleEdited) return;
        const targetDate = ui.formDate.value || state.activeDate || formatDateKey(new Date());
        const count = state.notes.filter(n =>
          n.department === ui.formDept.value &&
          n.section === ui.formSec.value &&
          n.date === targetDate &&
          (!ui.formCourse.value || n.course === ui.formCourse.value)
        ).length;
        ui.formTitle.value = `Note ${count + 1}`;
      }

      function renderCalendarGrid() {
        const year = state.viewDate.getFullYear();
        const month = state.viewDate.getMonth();
        ui.calendarTitle.textContent = `${MONTHS[month]} ${year}`;

        const firstDay = new Date(year, month, 1).getDay();
        const totalDays = new Date(year, month + 1, 0).getDate();
        const todayKey = formatDateKey(new Date());

        const noteCounts = {};
        getApprovedNotes().forEach(n => {
          if (n.date) noteCounts[n.date] = (noteCounts[n.date] || 0) + 1;
        });

        let markup = "<tr>";
        let col = 0;

        for (let i = 0; i < firstDay; i++) {
          markup += '<td class="calendar-cell"></td>';
          col++;
        }

        for (let day = 1; day <= totalDays; day++) {
          if (col === 7) {
            markup += "</tr><tr>";
            col = 0;
          }

          const dateKey = `${year}-${String(month + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
          const isToday = dateKey === todayKey;
          const isFuture = dateKey > todayKey;
          const count = noteCounts[dateKey] || 0;

          const classes = [
            "calendar-cell",
            isToday ? "calendar-cell--today" : "",
            isFuture ? "calendar-cell--disabled" : "",
            count > 0 ? "has-notes" : ""
          ].filter(Boolean).join(" ");

          markup += `
            <td class="${classes}" data-date="${dateKey}">
              <button type="button" class="calendar-cell__btn" data-date="${dateKey}" ${isFuture ? "disabled" : ""}>
                ${day}
              </button>
            </td>
          `;
          col++;
        }

        while (col > 0 && col < 7) {
          markup += '<td class="calendar-cell"></td>';
          col++;
        }
        markup += "</tr>";

        ui.calendarCells.innerHTML = markup;
      }

      function renderCourseDates() {
        let filtered = getApprovedNotes();
        if (state.course !== "ALL") filtered = filtered.filter(n => n.course === state.course);
        if (state.topic !== "ALL") filtered = filtered.filter(n => n.topic === state.topic);

        const uniqueDates = [...new Set(filtered.map(n => n.date))].sort();

        const titleParts = [];
        if (state.course !== "ALL") titleParts.push(state.course);
        if (state.topic !== "ALL") titleParts.push(`Topic: ${state.topic}`);
        ui.courseTitle.textContent = titleParts.length ? titleParts.join(" • ") : "All Lectures";
        ui.courseCount.textContent = `(${uniqueDates.length} ${uniqueDates.length === 1 ? 'lecture date' : 'lecture dates'})`;

        if (!uniqueDates.length) {
          ui.courseDatesList.style.display = "block";
          ui.courseDatesList.innerHTML = getEmptyState("No lecture notes recorded for this selection yet.");
          return;
        }

        ui.courseDatesList.style.display = "";
        ui.courseDatesList.innerHTML = uniqueDates.map(dateKey => {
          const count = filtered.filter(n => n.date === dateKey).length;
          const dayName = DAYS[parseLocalDate(dateKey).getDay()] || "";

          return `
            <div class="course-card" data-date="${escapeHtml(dateKey)}">
              <div class="course-card__info">
                <span class="course-card__date">${formatReadableDate(dateKey)}</span>
                <span class="course-card__day">${dayName}</span>
              </div>
              <span class="course-card__badge">${count} ${count === 1 ? 'note' : 'notes'}</span>
            </div>
          `;
        }).join("");
      }

      function renderModalNotes() {
        if (!state.activeDate) return;
        ui.modalDateLabel.textContent = `Date: ${formatReadableDate(state.activeDate)}`;

        let notes = getApprovedNotes().filter(n => n.date === state.activeDate);
        if (state.course !== "ALL") notes = notes.filter(n => n.course === state.course);
        if (state.topic !== "ALL") notes = notes.filter(n => n.topic === state.topic);

        ui.modalNotesTotal.textContent = `Total: ${notes.length} ${notes.length === 1 ? 'note' : 'notes'}`;

        if (!notes.length) {
          ui.modalNotesStack.innerHTML = getEmptyState("No notes attached to this date matching selected criteria.");
          return;
        }

        const groups = {};
        notes.forEach(note => {
          const c = note.course || "General";
          const t = note.topic || "Class Notes";
          if (!groups[c]) groups[c] = {};
          if (!groups[c][t]) groups[c][t] = [];
          groups[c][t].push(note);
        });

        let html = "";
        for (const course in groups) {
          html += `
            <div class="note-cluster">
              <h4 class="note-cluster__course">${escapeHtml(course)}</h4>
          `;

          for (const topic in groups[course]) {
            html += `
              <div class="note-cluster__topic-group">
                <div class="note-cluster__topic-header">${escapeHtml(topic)}</div>
                <ul class="note-cluster__list">
            `;

            groups[course][topic].forEach(item => {
              const url = formatLink(item.link);
              const title = escapeHtml(item.title || "Lecture Resource");
              const isReported = Number(item.reportCount || 0) >= 3;

              html += `
                <li class="note-row">
                  <div class="note-row__left">
                    <svg class="note-row__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                      <polyline points="14 2 14 8 20 8"></polyline>
                      <line x1="16" y1="13" x2="8" y2="13"></line>
                    </svg>
                    ${url ? `<a href="${url}" target="_blank" rel="noopener noreferrer" class="note-row__link">${title}</a>` : `<span class="note-row__plain">${title}</span>`}
                    ${isReported ? '<span class="note-row__flag">[Issue Reported]</span>' : ""}
                  </div>
                  ${url ? `<button type="button" class="btn-report" data-row="${escapeHtml(item.row)}" data-title="${title}" data-course="${escapeHtml(course)}">Report</button>` : ""}
                </li>
              `;
            });

            html += "</ul></div>";
          }
          html += "</div>";
        }

        ui.modalNotesStack.innerHTML = html;
      }

      function render() {
        syncBadgeText();
        const showCalendar = (state.course === "ALL" && state.topic === "ALL");
        ui.calendarView.hidden = !showCalendar;
        ui.courseView.hidden = showCalendar;

        if (showCalendar) {
          renderCalendarGrid();
        } else {
          renderCourseDates();
        }
      }

      function openDateDetails(dateKey) {
        state.activeDate = dateKey;
        renderModalNotes();
        if (!ui.notesModal.open) ui.notesModal.showModal();
      }

      async function syncData(payload) {
        if (!config.googleAppsScriptUrl) return;
        return fetch(config.googleAppsScriptUrl, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });
      }

      async function loadNotes() {
        if (!config.googleAppsScriptUrl) return;
        try {
          const res = await fetch(config.googleAppsScriptUrl);
          const data = await res.json();
          if (data?.success && Array.isArray(data.notes)) {
            state.notes = data.notes;
            syncTopicDropdown();
            render();
          }
        } catch (err) {
          console.warn("Could not sync notes:", err);
        }
      }

      function bindEvents() {
        // Native clean dialog backdrop click
        document.querySelectorAll("dialog").forEach(dialog => {
          dialog.addEventListener("click", e => {
            if (e.target === dialog) dialog.close();
          });
        });

        ui.notesModal.addEventListener("close", () => {
          state.activeDate = null;
        });

        ui.btnCancelAdd.addEventListener("click", () => ui.addModal.close());
        ui.btnCancelReport.addEventListener("click", () => ui.reportModal.close());

        ui.dept.addEventListener("change", e => {
          state.dept = e.target.value;
          syncDropdownStates();
          render();
        });

        ui.sec.addEventListener("change", e => {
          state.sec = e.target.value;
          syncTopicDropdown();
          render();
        });

        ui.course.addEventListener("change", e => {
          state.course = e.target.value;
          syncTopicDropdown();
          render();
        });

        ui.topic.addEventListener("change", e => {
          state.topic = e.target.value;
          render();
        });

        ui.prevMonthBtn.addEventListener("click", () => {
          state.viewDate.setMonth(state.viewDate.getMonth() - 1);
          render();
        });

        ui.nextMonthBtn.addEventListener("click", () => {
          state.viewDate.setMonth(state.viewDate.getMonth() + 1);
          render();
        });

        ui.todayBtn.addEventListener("click", () => {
          state.viewDate = new Date(today.getFullYear(), today.getMonth(), 1);
          render();
        });

        ui.calendarCells.addEventListener("click", e => {
          const cell = e.target.closest("td[data-date]");
          if (cell && cell.dataset.date) openDateDetails(cell.dataset.date);
        });

        ui.courseDatesList.addEventListener("click", e => {
          const card = e.target.closest("[data-date]");
          if (card && card.dataset.date) openDateDetails(card.dataset.date);
        });

        ui.addNoteBtn.addEventListener("click", () => {
          state.manualTitleEdited = false;
          const todayKey = formatDateKey(new Date());

          ui.formDate.max = todayKey;
          ui.formDept.value = state.dept;

          const activeDept = getActiveDept();
          if (activeDept) {
            setOptions(ui.formSec, activeDept.sections);
            setOptions(ui.formCourse, activeDept.courses);
          }

          ui.formSec.value = state.sec;
          ui.formDate.value = (state.activeDate && state.activeDate <= todayKey) ? state.activeDate : todayKey;
          if (state.course !== "ALL") ui.formCourse.value = state.course;
          if (state.topic !== "ALL") ui.formTopic.value = state.topic;

          calculateDefaultTitle();
          ui.addModal.showModal();
        });

        ui.formDept.addEventListener("change", () => {
          const activeDept = config.departments.find(d => d.code === ui.formDept.value);
          if (activeDept) {
            setOptions(ui.formSec, activeDept.sections);
            setOptions(ui.formCourse, activeDept.courses);
          }
          calculateDefaultTitle();
        });

        [ui.formSec, ui.formDate, ui.formCourse].forEach(el => {
          el.addEventListener("change", calculateDefaultTitle);
        });

        ui.formTitle.addEventListener("input", () => {
          state.manualTitleEdited = ui.formTitle.value.trim().length > 0;
        });

        ui.addForm.addEventListener("submit", async e => {
          e.preventDefault();
          ui.btnSubmitNote.disabled = true;
          ui.btnSubmitNote.classList.add("is-loading");

          const payload = {
            department: ui.formDept.value,
            section: ui.formSec.value,
            date: ui.formDate.value,
            course: ui.formCourse.value,
            topic: ui.formTopic.value,
            title: ui.formTitle.value,
            link: formatLink(ui.formLink.value),
            status: "Pending"
          };

          try {
            await syncData(payload);
            ui.addModal.close();
            ui.addForm.reset();
            state.manualTitleEdited = false;
            showToast("Note submitted successfully for review!");
          } catch {
            showToast("Failed to submit note. Please retry.", "error");
          } finally {
            ui.btnSubmitNote.disabled = false;
            ui.btnSubmitNote.classList.remove("is-loading");
          }
        });

        ui.modalNotesStack.addEventListener("click", e => {
          const btn = e.target.closest(".btn-report");
          if (!btn) return;

          ui.reportTitle.textContent = btn.dataset.title;
          ui.reportContext.textContent = `${btn.dataset.course} • ${formatReadableDate(state.activeDate)}`;
          ui.reportForm.dataset.targetRow = btn.dataset.row;
          ui.reportModal.showModal();
        });

        ui.reportForm.addEventListener("submit", async e => {
          e.preventDefault();
          const row = ui.reportForm.dataset.targetRow;
          const key = `reported_${row}`;

          if (localStorage.getItem(key)) {
            ui.reportModal.close();
            showToast("You have already reported this link.", "error");
            return;
          }

          ui.btnSubmitReport.disabled = true;
          ui.btnSubmitReport.classList.add("is-loading");

          try {
            await syncData({ type: "report", row });
            try { localStorage.setItem(key, "true"); } catch {}
            ui.reportModal.close();
            showToast("Report submitted successfully.");
          } catch {
            showToast("Could not submit report. Check connection.", "error");
          } finally {
            ui.btnSubmitReport.disabled = false;
            ui.btnSubmitReport.classList.remove("is-loading");
          }
        });
      }

      function init() {
        const codes = config.departments.map(d => d.code);
        setOptions(ui.dept, codes);
        setOptions(ui.formDept, codes);

        syncDropdownStates();
        bindEvents();
        render();
        loadNotes();
      }

      document.addEventListener("DOMContentLoaded", init);
    })();
  </script>
</body>
</html>
