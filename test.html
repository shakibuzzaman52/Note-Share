<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClassNotes — Organized Lecture Notes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-canvas: #f6f0e2;
      --bg-surface: #FFFFFF;
      --bg-subtle: #ECE5D7;
      --bg-hover: #E3DCCF;
      --bg-pill: #EBE4D5;

      --bg-class-notes-badge: #FFB4F9;

      --border-subtle: #E4DCD0;

      --text-main: #181716;
      --text-muted: #3C3833;
      --text-subtle: #8A847A;
      --text-disabled: #B8B0A5;

      --brand-primary: #0A37F5;
      --brand-primary-hover: #072CC4;
      --brand-dark: #181716;
      --brand-dark-hover: #2B2A28;
      --brand-danger: #DC2626;
      --brand-danger-hover: #B91C1C;

      --radius-full: 9999px;
      --radius-lg: 16px;
      --radius-md: 10px;

      --font-display: 'Instrument Serif', Georgia, serif;
      --font-body: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    button, input, select {
      font-family: inherit;
      border: 0;
      outline: 0;
    }

    button {
      background: transparent;
    }

    body {
      background-color: var(--bg-canvas);
      color: var(--text-main);
      font-family: var(--font-body);
      font-size: 15px;
      line-height: 1.5;
      min-height: 100vh;
      padding-bottom: 4rem;
    }

    .shell {
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      padding: 0 clamp(1rem, 4vw, 2.5rem);
    }

    /* Core button primitives */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      position: relative;
      font-size: 0.875rem;
      font-weight: 600;
      padding: 0.625rem 1.25rem;
      border-radius: var(--radius-full);
      cursor: pointer;
      text-decoration: none;
      white-space: nowrap;
      transition: background-color 0.15s ease, opacity 0.15s ease;
    }

    .btn:disabled {
      cursor: not-allowed;
      opacity: 0.6;
    }

    .btn--primary {
      background-color: var(--brand-primary);
      color: #FFFFFF;
    }
    .btn--primary:hover:not(:disabled) {
      background-color: var(--brand-primary-hover);
    }

    .btn--dark {
      background-color: var(--brand-dark);
      color: #FFFFFF;
      padding: 0.5rem 1.15rem;
      font-size: 0.8125rem;
    }
    .btn--dark:hover:not(:disabled) {
      background-color: var(--brand-dark-hover);
    }

    .btn--ghost {
      background-color: var(--bg-subtle);
      color: var(--text-main);
    }
    .btn--ghost:hover:not(:disabled) {
      background-color: var(--bg-hover);
    }

    .btn--subtle {
      background-color: var(--bg-canvas);
      color: var(--text-main);
      border: 1px solid var(--border-subtle);
      padding: 0.5rem 1rem;
      font-size: 0.8125rem;
      gap: 0.4rem;
    }
    .btn--subtle:hover:not(:disabled) {
      background-color: var(--bg-subtle);
    }
    .btn--subtle svg {
      flex-shrink: 0;
    }

    .btn--danger {
      background-color: var(--brand-danger);
      color: #FFFFFF;
    }
    .btn--danger:hover:not(:disabled) {
      background-color: var(--brand-danger-hover);
    }

    .btn.is-loading {
      pointer-events: none;
      color: transparent;
    }

    .btn.is-loading::after {
      content: '';
      position: absolute;
      width: 1rem;
      height: 1rem;
      border: 2px solid #FFFFFF;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }

    /* Badges */
    .badge {
      display: inline-flex;
      align-items: center;
      background: var(--bg-subtle);
      color: var(--text-main);
      font-family: var(--font-display);
      font-style: italic;
      border-radius: var(--radius-full);
      padding: 0.15rem 0.85rem;
    }

    .hero__title .badge {
      background-color: var(--bg-class-notes-badge);
    }

    /* Form controls */
    .field {
      margin-bottom: 1rem;
    }

    .field label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-subtle);
      margin-bottom: 0.35rem;
    }

    .field input,
    .field select {
      width: 100%;
      background: var(--bg-subtle);
      border-radius: var(--radius-md);
      padding: 0.75rem 1rem;
      font-size: 0.9375rem;
      color: var(--text-main);
      transition: background-color 0.15s ease;
    }

    .field input:focus,
    .field select:focus {
      background: var(--bg-hover);
    }

    .field select {
      cursor: pointer;
      appearance: none;
      background-image: url("data:image/svg+xml,%3Csvg width='12' height='8' viewBox='0 0 12 8' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1.5 1.75L6 6.25L10.5 1.75' stroke='%236E6961' stroke-width='1.75' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
      background-repeat: no-repeat;
      background-position: right 1rem center;
    }

    /* Header */
    .site-header {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.75rem clamp(1rem, 4vw, 3.5rem);
      background: var(--bg-canvas);
    }

    .brand-mark {
      font-family: var(--font-display);
      font-style: italic;
      font-size: 1.875rem;
      letter-spacing: -0.02em;
      color: var(--text-main);
      line-height: 1;
    }

    .brand-mark sup {
      font-size: 0.75rem;
      font-family: var(--font-body);
      font-style: normal;
      color: var(--text-subtle);
      font-weight: 600;
      margin-left: 2px;
    }

    /* Hero Section */
    .hero {
      padding-top: clamp(3.5rem, 6vw, 5.5rem);
      text-align: center;
      max-width: 840px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .hero__title {
      font-family: var(--font-display);
      font-size: clamp(2.5rem, 5vw, 4.25rem);
      font-weight: 400;
      line-height: 1.12;
      letter-spacing: -0.025em;
      color: var(--text-main);
      margin-bottom: 1.4rem;
    }

    .hero__desc {
      font-size: clamp(1rem, 1.2vw, 1.125rem);
      color: var(--text-muted);
      max-width: 500px;
      line-height: 1.6;
      margin: 0 auto clamp(2rem, 3.5vw, 2.75rem);
    }

    /* Selection Banner */
    .selection-banner-wrapper {
      margin: 0 auto 0.85rem;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .selection-banner {
      font-family: var(--font-display);
      font-size: clamp(1.25rem, 2.3vw, 1.65rem);
      font-weight: 400;
      letter-spacing: -0.015em;
      color: var(--text-main);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0.45rem;
      line-height: 1.35;
    }

    .selection-banner .badge {
      background-color: var(--brand-primary);
      color: #FFFFFF;
      font-size: 0.95em;
    }

    /* Filters Bar */
    .nav-filters {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: clamp(0.35rem, 1.5vw, 0.85rem);
      width: 100%;
      margin: 0 0 1rem;
      padding: 0.35rem 0 1rem;
      border-bottom: 1px solid var(--border-subtle);
      position: relative;
    }

    .nav-filter__item {
      position: relative;
      min-width: 0;
    }

    .nav-filter__trigger {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(0.2rem, 0.8vw, 0.45rem);
      background-color: var(--bg-subtle);
      border-radius: var(--radius-full);
      padding: 0.55rem clamp(0.35rem, 1vw, 1rem);
      color: var(--text-main);
      font-size: clamp(0.75rem, 1.1vw, 0.875rem);
      font-weight: 600;
      cursor: pointer;
      user-select: none;
      width: 100%;
      -webkit-tap-highlight-color: transparent;
      transition: background-color 0.15s ease, border-color 0.15s ease;
      border: 1px solid transparent;
    }

    .nav-filter__trigger:hover {
      background-color: var(--bg-hover);
    }

    .nav-filter__text {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      pointer-events: none;
      min-width: 0;
    }

    .nav-filter__arrow {
      pointer-events: none;
      flex-shrink: 0;
      color: var(--text-muted);
    }

    .nav-filter__menu {
      position: absolute;
      top: calc(100% + 5px);
      left: 0;
      width: max-content;
      min-width: 240px;
      max-width: min(420px, calc(100vw - 2rem));
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 0.35rem 0;
      z-index: 150;
      max-height: 260px;
      overflow-y: auto;
    }

    .nav-filter__menu[hidden] {
      display: none;
    }

    .nav-filter__item:nth-child(3) .nav-filter__menu,
    .nav-filter__item:nth-child(4) .nav-filter__menu {
      left: auto;
      right: 0;
    }

    .nav-filter__option {
      display: flex;
      align-items: center;
      width: 100%;
      padding: 0.55rem 0.95rem;
      font-size: 0.8125rem;
      font-weight: 500;
      color: var(--text-main);
      text-align: left;
      cursor: pointer;
      word-break: break-word;
      line-height: 1.4;
      transition: background-color 0.12s ease;
    }

    .nav-filter__option:hover {
      background-color: var(--bg-hover);
    }

    .nav-filter__option.is-selected {
      font-weight: 700;
      background-color: var(--bg-pill);
      color: var(--brand-primary);
    }

    .nav-filter__empty {
      padding: 0.75rem 1rem;
      color: var(--text-subtle);
      font-size: 0.8125rem;
    }

    /* Content Area */
    .content-area {
      margin-top: 0.5rem;
    }

    /* CALENDAR VIEW & COURSE VIEW */
    #calendar-view,
    .course-dates-view {
      padding: 0.5rem 0 1rem;
    }

    .calendar-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.85rem;
      padding-bottom: 0.85rem;
      border-bottom: 1px solid var(--border-subtle);
      flex-wrap: wrap;
      gap: 1rem;
    }

    .calendar-nav__title {
      font-family: var(--font-display);
      font-size: 2.75rem;
      font-weight: 400;
      letter-spacing: -0.02em;
      color: var(--text-main);
      line-height: 1;
    }

    .calendar-nav__actions {
      display: flex;
      align-items: center;
      gap: 0.45rem;
    }

    .calendar-grid {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0 0.85rem;
      table-layout: fixed;
    }

    .calendar-grid th {
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--text-muted);
      padding: 0.25rem 0.25rem 0.75rem;
      text-align: center;
    }

    .calendar-cell {
      height: 56px;
      text-align: center;
      vertical-align: middle;
      padding: 0;
    }

    .calendar-cell--empty {
      pointer-events: none;
    }

    .calendar-cell__btn {
      width: 48px;
      height: 48px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--bg-pill);
      border: 1px solid var(--border-subtle);
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--text-main);
      border-radius: 50%;
      cursor: pointer;
      transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    }

    .calendar-cell__btn:hover:not(:disabled) {
      background-color: var(--bg-hover);
      border-color: #D6CEC0;
    }

    /* Today: normal black border */
    .calendar-cell--today .calendar-cell__btn {
      border: 2px solid var(--text-main);
      font-weight: 700;
    }

    /* Dates containing notes: clean blue border only */
    .calendar-cell.has-notes .calendar-cell__btn {
      border: 2px solid var(--brand-primary);
      color: var(--brand-primary);
      font-weight: 700;
    }

    .calendar-cell.has-notes .calendar-cell__btn:hover:not(:disabled) {
      border-color: var(--brand-primary-hover);
    }

    .calendar-cell--disabled {
      pointer-events: none;
    }

    .calendar-cell--disabled .calendar-cell__btn {
      background-color: transparent;
      border-color: transparent;
      color: var(--text-disabled);
      opacity: 0.4;
      cursor: default;
    }

    .course-dates__header {
      display: flex;
      align-items: baseline;
      gap: 0.75rem;
      margin-bottom: 1.25rem;
      padding-bottom: 0.85rem;
      border-bottom: 1px solid var(--border-subtle);
      flex-wrap: wrap;
    }

    .course-dates__title {
      font-family: var(--font-display);
      font-size: 2.25rem;
      font-weight: 400;
      color: var(--text-main);
      line-height: 1.1;
    }

    .course-dates__count {
      font-size: 0.875rem;
      color: var(--text-subtle);
      font-weight: 600;
    }

    .course-dates__grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 0.85rem;
      width: 100%;
    }

    .course-card {
      background-color: var(--bg-pill);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 0.95rem 1.15rem;
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.75rem;
      transition: background-color 0.15s ease, border-color 0.15s ease;
      text-align: left;
    }

    .course-card:hover {
      background-color: var(--bg-hover);
      border-color: #D6CEC0;
    }

    .course-card__info {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .course-card__date {
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--text-main);
      line-height: 1.3;
    }

    .course-card__day {
      font-size: 0.8125rem;
      color: var(--text-subtle);
      font-weight: 500;
    }

    .course-card__badge {
      align-self: flex-start;
      background-color: var(--bg-subtle);
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      padding: 0.2rem 0.65rem;
      border-radius: var(--radius-full);
      font-size: 0.75rem;
      font-weight: 600;
      white-space: nowrap;
    }

    /* Modals */
    .dialog-modal {
      position: fixed;
      inset: 0;
      margin: auto;
      max-width: 500px;
      width: calc(100% - 2rem);
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 2rem;
      color: var(--text-main);
    }

    .dialog-modal::backdrop {
      background: rgba(24, 23, 22, 0.45);
      backdrop-filter: blur(6px);
      cursor: pointer;
    }

    .dialog-modal__header {
      padding-bottom: 0.85rem;
      border-bottom: 1px solid var(--border-subtle);
    }

    .dialog-modal__title {
      font-family: var(--font-display);
      font-size: 1.75rem;
      font-weight: 400;
      letter-spacing: -0.02em;
      margin-bottom: 0.2rem;
    }

    .dialog-modal__desc {
      font-size: 0.8125rem;
      color: var(--text-subtle);
      font-weight: 600;
    }

    .dialog-modal__text {
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    .dialog-modal__actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 0.75rem;
      margin-top: 1.5rem;
    }

    .notes-stack {
      max-height: 52vh;
      overflow-y: auto;
      margin-top: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 3.5rem 1.5rem;
      gap: 0.85rem;
      width: 100%;
      grid-column: 1 / -1;
      margin: 0 auto;
    }

    .empty-state__icon {
      width: 44px;
      height: 44px;
      color: var(--text-subtle);
      opacity: 0.75;
    }

    .empty-state__text {
      font-size: 0.9375rem;
      color: var(--text-subtle);
      font-weight: 500;
      max-width: 420px;
      line-height: 1.45;
    }

    .note-cluster {
      background-color: #FAF5EB;
      border-radius: var(--radius-md);
      padding: 0.95rem 1.15rem;
    }

    .note-cluster__course {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 0.4rem;
    }

    .note-cluster__topic-group {
      margin-left: 1.1rem;
      margin-top: 0.45rem;
      margin-bottom: 0.65rem;
    }

    .note-cluster__topic-group:last-child {
      margin-bottom: 0;
    }

    .note-cluster__topic-header {
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 0.35rem;
    }

    .note-cluster__list {
      list-style: none;
      margin-left: 1.1rem;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .note-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 0.15rem 0;
    }

    .note-row__left {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      font-size: 0.9rem;
    }

    .note-row__icon {
      width: 14px;
      height: 14px;
      color: var(--text-subtle);
      flex-shrink: 0;
    }

    .note-row__link {
      color: var(--brand-primary);
      text-decoration: none;
      font-weight: 500;
    }

    .note-row__link:hover {
      text-decoration: underline;
    }

    .note-row__plain {
      color: var(--text-main);
      font-weight: 500;
    }

    .note-row__flag {
      color: var(--brand-danger);
      font-weight: 600;
      font-size: 0.72rem;
      margin-left: 0.25rem;
    }

    .btn-report {
      color: var(--text-subtle);
      font-size: 0.75rem;
      font-weight: 500;
      cursor: pointer;
      text-decoration: underline;
      padding: 0.1rem 0.25rem;
      transition: color 0.15s ease;
    }

    .btn-report:hover {
      color: var(--brand-danger);
    }

    /* Toast Notification */
    .toast-tray {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      pointer-events: none;
    }

    .toast {
      pointer-events: auto;
      background: var(--brand-dark);
      color: #FFFFFF;
      padding: 0.75rem 1.25rem;
      border-radius: var(--radius-md);
      font-size: 0.875rem;
      font-weight: 500;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.16);
      transition: opacity 0.25s ease;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 768px) {
      .site-header { padding: 1.25rem 1rem; }
      .hero { padding-top: 2rem; }
      .hero__desc { margin-bottom: 1.5rem; }
      .selection-banner { font-size: 1.2rem; }
      .calendar-nav__title { font-size: 2.15rem; }
      .calendar-nav { margin-bottom: 0.65rem; padding-bottom: 0.65rem; }
      .calendar-grid { border-spacing: 0 0.4rem; }
      .calendar-cell { height: 46px; }
      .calendar-cell__btn { width: 38px; height: 38px; font-size: 0.8125rem; }

      .nav-filter__menu {
        min-width: 170px;
        max-width: calc(100vw - 1.5rem);
      }

      .dialog-modal { padding: 1.5rem 1.25rem; }
      .toast-tray { left: 1rem; right: 1rem; bottom: 1rem; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <h1 class="brand-mark">ClassNotes<sup>®</sup></h1>
    <button type="button" class="btn btn--primary" id="trigger-add-note">+ Add Note</button>
  </header>
  <div class="shell">
    <!-- Hero Section -->
    <section class="hero">
      <h2 class="hero__title">Lecture archive &amp; <span class="badge">class notes</span></h2>
      <p class="hero__desc">Browse lecture slides, handouts, and shared class resources organized by section date.</p>

      <!-- Selection Banner -->
      <div class="selection-banner-wrapper">
        <div id="selection-banner" class="selection-banner"></div>
      </div>
    </section>

    <!-- 4-column filter bar -->
    <nav class="nav-filters" aria-label="Class and Lecture Filters">
      <!-- 1. Department -->
      <div class="nav-filter__item" data-filter="dept">
        <button type="button" class="nav-filter__trigger" id="dept-trigger" aria-haspopup="listbox" aria-expanded="false">
          <span class="nav-filter__text" id="dept-label">Department</span>
          <svg class="nav-filter__arrow" width="11.5" height="7" viewBox="0 0 12 8" fill="none" aria-hidden="true">
            <path d="M1.75 2.25L6 6.25L10.25 2.25" stroke="currentColor" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- 2. Section -->
      <div class="nav-filter__item" data-filter="sec">
        <button type="button" class="nav-filter__trigger" id="sec-trigger" aria-haspopup="listbox" aria-expanded="false">
          <span class="nav-filter__text" id="sec-label">Section</span>
          <svg class="nav-filter__arrow" width="11.5" height="7" viewBox="0 0 12 8" fill="none" aria-hidden="true">
            <path d="M1.75 2.25L6 6.25L10.25 2.25" stroke="currentColor" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <div class="nav-filter__menu" id="sec-menu" hidden role="listbox"></div>

      <!-- 3. Course -->
      <div class="nav-filter__item" data-filter="course">
        <button type="button" class="nav-filter__trigger" id="course-trigger" aria-haspopup="listbox" aria-expanded="false">
          <span class="nav-filter__text" id="course-label">Course</span>
          <svg class="nav-filter__arrow" width="11.5" height="7" viewBox="0 0 12 8" fill="none" aria-hidden="true">

      <!-- 4. Topic -->
      <div class="nav-filter__item" data-filter="topic">

          <span class="nav-filter__text" id="topic-label">Topic</span>
          <svg class="nav-filter__arrow" width="11.5" height="7" viewBox="0 0 12 8" fill="none" aria-hidden="true">
            <path d="M1.75 2.25L6 6.25L10.25 2.25" stroke="currentColor" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <div class="nav-filter__menu" id="topic-menu" hidden role="listbox"></div>
      </div>
    </nav>

    <main class="content-area">
      <!-- Calendar View -->
      <section id="calendar-view">
        <div class="calendar-nav">
          <h2 class="calendar-nav__title" id="calendar-header-title"></h2>
          <div class="calendar-nav__actions">
            <button type="button" class="btn btn--subtle" id="cal-prev" aria-label="Previous Month">
              <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M10 13L5 8L10 3"/>
              </svg>
              <span>Prev</span>
            </button>
            <button type="button" class="btn btn--dark" id="cal-today">Today</button>

          <span class="course-dates__count" id="course-view-count"></span>

        </div>

        <div class="field">
          <label for="input-topic">Topic:</label>
          <input type="text" id="input-topic" placeholder="e.g. Graph Traversal Algorithms" required>
        </div>

        <div class="field">
          <label for="input-title">Title:</label>
          <input type="text" id="input-title" placeholder="e.g. Lecture Slide 12" required>
        </div>

        <div class="field">
          <label for="input-link">Resource URL:</label>
          <input type="text" id="input-link" inputmode="url" placeholder="https://... (Drive, Notion, OneDrive, Dropbox, etc.)">

    <!-- Modal: Report link -->

          <small id="report-note-context" class="dialog-modal__desc"></small>
        </p>

          Flagging this note notifies section classmates that the link is expired or inaccessible.
        </p>

        <div class="dialog-modal__actions">
          <button type="button" class="btn btn--ghost" data-close-modal>Cancel</button>

  </div>

  <div class="toast-tray" id="toast-tray" aria-live="polite"></div>
  <script src="config.js"></script>
  <script>
    (function () {
      "use strict";

      const config = window.APP_CONFIG || {
        googleAppsScriptUrl: "",
        departments: [
          {
            code: "CSE",
            sections: ["73_A", "73_B", "73_L"],
            courses: ["CSE Fundamentals", "CSE101", "CSE102", "CSE103"]
          }
        ]
      };

      const MONTH_NAMES = [
        "January", "February", "March", "April", "May", "June",
        "July", "August", "September", "October", "November", "December"
      ];
      const DAY_NAMES = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

      const now = new Date();

      const state = {
        dept: "",
        sec: "",
        course: "ALL",
        topic: "ALL",
        viewDate: new Date(now.getFullYear(), now.getMonth(), 1),
        activeDate: null,
        notes: [],
        manualTitleEdited: false
      };

      const ui = {
        selectionBanner: document.getElementById("selection-banner"),

        deptTrigger: document.getElementById("dept-trigger"),
        secTrigger: document.getElementById("sec-trigger"),
        courseTrigger: document.getElementById("course-trigger"),
        topicTrigger: document.getElementById("topic-trigger"),

        deptMenu: document.getElementById("dept-menu"),
        secMenu: document.getElementById("sec-menu"),
        courseMenu: document.getElementById("course-menu"),
        topicMenu: document.getElementById("topic-menu"),

        deptLabel: document.getElementById("dept-label"),
        secLabel: document.getElementById("sec-label"),
        courseLabel: document.getElementById("course-label"),
        topicLabel: document.getElementById("topic-label"),

        calendarView: document.getElementById("calendar-view"),
        calendarTitle: document.getElementById("calendar-header-title"),
        calendarCells: document.getElementById("calendar-cells"),
        prevMonthBtn: document.getElementById("cal-prev"),
        todayBtn: document.getElementById("cal-today"),
        nextMonthBtn: document.getElementById("cal-next"),

        courseView: document.getElementById("course-view"),
        courseTitle: document.getElementById("course-view-title"),
        courseCount: document.getElementById("course-view-count"),
        courseDatesList: document.getElementById("course-dates-list"),

        notesModal: document.getElementById("notes-modal"),
        modalDateLabel: document.getElementById("modal-date-label"),
        modalNotesTotal: document.getElementById("modal-notes-total"),
        modalNotesStack: document.getElementById("modal-notes-stack"),

        addModal: document.getElementById("add-modal"),
        addNoteBtn: document.getElementById("trigger-add-note"),
        addForm: document.getElementById("add-note-form"),
        formDept: document.getElementById("input-dept"),
        formSec: document.getElementById("input-section"),
        formDate: document.getElementById("input-date"),
        formCourse: document.getElementById("input-course"),
        formTopic: document.getElementById("input-topic"),
        formTitle: document.getElementById("input-title"),
        formLink: document.getElementById("input-link"),
        btnSubmitNote: document.getElementById("btn-submit-note"),

        reportModal: document.getElementById("report-modal"),
        reportForm: document.getElementById("report-link-form"),
        reportTitle: document.getElementById("report-note-title"),
        reportContext: document.getElementById("report-note-context"),
        btnSubmitReport: document.getElementById("btn-submit-report"),

        toastTray: document.getElementById("toast-tray")
      };

      const safeStorage = {
        get(key) {
          try {
            return localStorage.getItem(key);
          } catch {
            return null;
          }
        },
        set(key, val) {
          try {
            localStorage.setItem(key, val);
          } catch {}
        }
      };

      function formatDateKey(date) {
        return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`;
      }

      function parseLocalDate(dateKey) {
        if (!dateKey) return new Date();
        const parts = dateKey.split("-").map(Number);
        return new Date(parts[0], parts[1] - 1, parts[2]);
      }

      function formatReadableDate(dateKey) {
        if (!dateKey) return "";
        const [year, month, day] = dateKey.split("-");
        return `${parseInt(day, 10)} ${MONTH_NAMES[parseInt(month, 10) - 1]} ${year}`;
      }

      function pluralize(count, singular, plural) {
        return `${count} ${count === 1 ? singular : plural}`;
      }

      function escapeHtml(text) {
        if (!text) return "";
        return String(text)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function normalizeUrl(input) {
        if (!input) return "";
        const trimmed = String(input).trim();
        if (!trimmed) return "";
        return /^[a-z][a-z0-9+.-]*:/i.test(trimmed) ? trimmed : `https://${trimmed}`;
      }

      function sanitizeUrl(rawUrl) {
        if (!rawUrl) return "";
        const clean = String(rawUrl).trim();
        return /^(https?:|\/\/)/i.test(clean) ? clean : "#";
      }

      function setButtonLoading(btn, isLoading) {
        btn.disabled = isLoading;
        btn.classList.toggle("is-loading", isLoading);
      }

      function renderEmptyState(message) {
        return `
          <div class="empty-state">
            <svg class="empty-state__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
              <line x1="9" y1="13" x2="15" y2="13"></line>
            </svg>
            <p class="empty-state__text">${escapeHtml(message)}</p>
          </div>
        `;
      }

      function showToast(message) {
        ui.toastTray.innerHTML = "";
        const toast = document.createElement("div");
        toast.className = "toast";
        toast.textContent = message;
        ui.toastTray.appendChild(toast);

        setTimeout(() => {
          toast.style.opacity = "0";
          setTimeout(() => toast.remove(), 250);
        }, 2800);
      }

      async function syncData(payload) {
        if (!config.googleAppsScriptUrl) return;
        return fetch(config.googleAppsScriptUrl, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });
      }

      async function loadNotes() {
        if (!config.googleAppsScriptUrl) return;
        try {
          const res = await fetch(config.googleAppsScriptUrl);
          const data = await res.json();
          if (data?.success && Array.isArray(data.notes)) {
            state.notes = data.notes;
            syncTopicMenu();
            render();
          }
        } catch (err) {
          console.warn("Unable to sync lecture notes:", err);
        }
      }

      function getDeptMeta(code) {
        if (!code) return null;
        return config.departments.find(d => d.code === code) || null;
      }

      function renderFormOptions(selectEl, list, prefix = "") {
        selectEl.innerHTML = list.map(item => {
          const display = prefix ? `${prefix} ${item}` : item;
          return `<option value="${escapeHtml(item)}">${escapeHtml(display)}</option>`;
        }).join("");
      }

      function renderMenuOptions(container, list, selectedVal, includeAll = false, allLabel = "All Courses", prefix = "") {
        let html = "";
        if (includeAll) {
          const isSel = selectedVal === "ALL";
          html += `<button type="button" class="nav-filter__option ${isSel ? 'is-selected' : ''}" data-value="ALL">${escapeHtml(allLabel)}</button>`;
        }
        html += list.map(item => {
          const isSel = Boolean(selectedVal) && String(selectedVal) === String(item);
          const display = prefix ? `${prefix} ${item}` : item;
          return `<button type="button" class="nav-filter__option ${isSel ? 'is-selected' : ''}" data-value="${escapeHtml(item)}">${escapeHtml(display)}</button>`;
        }).join("");

        container.innerHTML = html;
      }

      function closeAllMenus() {
        [ui.deptMenu, ui.secMenu, ui.courseMenu, ui.topicMenu].forEach(menu => {
          menu.hidden = true;
        });
        [ui.deptTrigger, ui.secTrigger, ui.courseTrigger, ui.topicTrigger].forEach(btn => {
          btn.setAttribute("aria-expanded", "false");
        });
      }

      function toggleMenu(menu, trigger) {
        const isClosed = menu.hidden;
        closeAllMenus();
        if (isClosed) {
          menu.hidden = false;
          trigger.setAttribute("aria-expanded", "true");
        }
      }

      function updateFilterLabels() {
        ui.deptLabel.textContent = state.dept || "Department";
        ui.secLabel.textContent = state.sec ? `Sec ${state.sec}` : "Section";
        ui.courseLabel.textContent = (state.course === "ALL" || !state.course) ? "Course" : state.course;
        ui.topicLabel.textContent = (state.topic === "ALL" || !state.topic) ? "Topic" : state.topic;
      }

      function updateSelectionBanner() {
        if (!ui.selectionBanner) return;

        if (!state.dept) {
          ui.selectionBanner.innerHTML = 'Select your <span class="badge">department</span>';
          return;
        }

        if (!state.sec) {
          ui.selectionBanner.innerHTML = `<span class="badge">${escapeHtml(state.dept)}</span> &mdash; select <span class="badge">section</span>`;
          return;
        }

        ui.selectionBanner.innerHTML = `Viewing notes for <span class="badge">${escapeHtml(state.dept)} &mdash; Sec ${escapeHtml(state.sec)}</span>`;
      }

      function syncTopicMenu() {
        if (!state.dept || !state.sec) {
          ui.topicMenu.innerHTML = `<div class="nav-filter__empty">Select Department & Section first</div>`;
          return;
        }

        const matchingNotes = state.notes.filter(note =>
          note.department === state.dept &&
          note.section === state.sec &&
          (state.course === "ALL" || note.course === state.course) &&
          String(note.status || "").toLowerCase() === "approved" &&
          note.topic && note.topic.trim() !== ""
        );

        const uniqueTopics = [...new Set(matchingNotes.map(n => n.topic.trim()))].sort();
        if (!uniqueTopics.includes(state.topic)) {
          state.topic = "ALL";
        }
        renderMenuOptions(ui.topicMenu, uniqueTopics, state.topic, true, "All Topics");
      }

      function syncDropdownStates() {
        const allDeptCodes = config.departments.map(d => d.code);
        renderMenuOptions(ui.deptMenu, allDeptCodes, state.dept || null);

        const activeDept = getDeptMeta(state.dept);

        if (activeDept && state.dept) {
          renderMenuOptions(ui.secMenu, activeDept.sections, state.sec || null, false, "", "Sec");
          const selectedCourse = state.sec ? state.course : "ALL";
          renderMenuOptions(ui.courseMenu, activeDept.courses, selectedCourse, true, "All Courses");
        } else {
          ui.secMenu.innerHTML = `<div class="nav-filter__empty">Please select Department first</div>`;
          ui.courseMenu.innerHTML = `<div class="nav-filter__empty">Please select Department first</div>`;
        }

        syncTopicMenu();
      }

      function syncFormDropdowns() {
        const currentDept = getDeptMeta(ui.formDept.value) || config.departments[0];
        if (currentDept) {
          renderFormOptions(ui.formSec, currentDept.sections, "Sec");
          renderFormOptions(ui.formCourse, currentDept.courses);
        }
      }

      function calculateDefaultTitle() {
        if (state.manualTitleEdited) return;
        const activeCourse = ui.formCourse.value;
        const targetDate = ui.formDate.value || state.activeDate || formatDateKey(new Date());
        const existingCount = state.notes.filter(note =>
          note.department === ui.formDept.value &&
          note.section === ui.formSec.value &&
          note.date === targetDate &&
          (!activeCourse || note.course === activeCourse)
        ).length;

        ui.formTitle.value = `Note ${existingCount + 1}`;
      }

      function filterActiveNotes() {
        if (!state.dept || !state.sec) return [];

        return state.notes.filter(note =>
          note.department === state.dept &&
          note.section === state.sec &&
          String(note.status || "").toLowerCase() === "approved" &&
          (state.course === "ALL" || note.course === state.course) &&
          (state.topic === "ALL" || note.topic === state.topic)
        );
      }

      function openDateDetails(dateKey) {
        if (!state.dept || !state.sec) {
          showToast("Select Department & Section first");
          return;
        }
        state.activeDate = dateKey;
        renderModalNotes();
        if (!ui.notesModal.open) {
          ui.notesModal.showModal();
        }
      }

      function renderCalendarGrid() {
        const year = state.viewDate.getFullYear();
        const month = state.viewDate.getMonth();
        ui.calendarTitle.textContent = `${MONTH_NAMES[month]} ${year}`;

        const firstDay = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const notes = filterActiveNotes();

        const notesCountMap = {};
        notes.forEach(n => {
          if (n.date) {
            notesCountMap[n.date] = (notesCountMap[n.date] || 0) + 1;
          }
        });

        const todayKey = formatDateKey(new Date());

        let markup = "<tr>";
        let col = 0;

        for (let i = 0; i < firstDay; i++) {
          markup += '<td class="calendar-cell calendar-cell--empty"></td>';
          col++;
        }

        for (let d = 1; d <= daysInMonth; d++) {
          if (col === 7) {
            markup += "</tr><tr>";
            col = 0;
          }

          const dateKey = `${year}-${String(month + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
          const isFuture = dateKey > todayKey;
          const isToday = dateKey === todayKey;
          const noteCount = notesCountMap[dateKey] || 0;
          const hasNotes = noteCount > 0;

          const classes = [
            "calendar-cell",
            isToday && "calendar-cell--today",
            isFuture && "calendar-cell--disabled",
            hasNotes && "has-notes"
          ].filter(Boolean).join(" ");

          const noteTooltip = hasNotes ? `title="${pluralize(noteCount, 'note', 'notes')}"` : "";

          markup += `
            <td class="${classes}" data-date="${dateKey}">
              <button type="button" class="calendar-cell__btn" data-date="${dateKey}" ${isFuture ? "disabled" : ""} ${noteTooltip}>
                ${d}
              </button>
            </td>
          `;
          col++;
        }

        while (col < 7 && col > 0) {
          markup += '<td class="calendar-cell calendar-cell--empty"></td>';
          col++;
        }
        markup += "</tr>";

        ui.calendarCells.innerHTML = markup;
      }

      function renderCourseDates() {
        const filteredNotes = filterActiveNotes();
        const uniqueDates = [...new Set(filteredNotes.map(n => n.date))].sort();

        const titleParts = [];
        if (state.course !== "ALL") {
          titleParts.push(state.course);
        }
        if (state.topic !== "ALL") {
          titleParts.push(`Topic: ${state.topic}`);
        }
        if (titleParts.length === 0) {
          titleParts.push("Filtered Classes");
        }

        ui.courseTitle.textContent = titleParts.join(" • ");
        ui.courseCount.textContent = `(${pluralize(uniqueDates.length, 'lecture date', 'lecture dates')})`;

        if (!uniqueDates.length) {
          const emptyMsg = (!state.dept || !state.sec)
            ? "Please select department and section to view notes."
            : "No notes found matching your selected filters.";
          ui.courseDatesList.innerHTML = renderEmptyState(emptyMsg);
          return;
        }

        ui.courseDatesList.innerHTML = uniqueDates.map(dateStr => {
          const dateObj = parseLocalDate(dateStr);
          const noteCount = filteredNotes.filter(n => n.date === dateStr).length;
          const day = DAY_NAMES[dateObj.getDay()] || "";

          return `
            <div class="course-card" data-date="${escapeHtml(dateStr)}">
              <div class="course-card__info">
                <span class="course-card__date">${formatReadableDate(dateStr)}</span>
                <span class="course-card__day">${day}</span>
              </div>
              <span class="course-card__badge">${pluralize(noteCount, 'note', 'notes')}</span>
            </div>
          `;
        }).join("");
      }

      function renderModalNotes() {
        if (!state.activeDate) return;
        ui.modalDateLabel.textContent = `Date: ${formatReadableDate(state.activeDate)}`;

        const notes = filterActiveNotes().filter(n => n.date === state.activeDate);
        ui.modalNotesTotal.textContent = `Total: ${pluralize(notes.length, 'note', 'notes')}`;

        if (!notes.length) {
          const emptyMsg = (!state.dept || !state.sec)
            ? "Please select department and section first."
            : "No lecture material attached to this date for the selected criteria.";
          ui.modalNotesStack.innerHTML = renderEmptyState(emptyMsg);
          return;
        }

        const groups = {};
        notes.forEach(note => {
          const course = note.course || "General";
          const topic = note.topic || "Class Notes";
          if (!groups[course]) groups[course] = {};
          if (!groups[course][topic]) groups[course][topic] = [];
          groups[course][topic].push(note);
        });

        let output = "";
        for (const course in groups) {
          output += `
            <div class="note-cluster">
              <h4 class="note-cluster__course">${escapeHtml(course)}</h4>
          `;

          for (const topic in groups[course]) {
            output += `
              <div class="note-cluster__topic-group">
                <div class="note-cluster__topic-header">${escapeHtml(topic)}</div>
                <ul class="note-cluster__list">
            `;

            groups[course][topic].forEach((item) => {
              const isReported = Number(item.reportCount || 0) >= 3;
              const rawTitle = item.title || "View Note";
              const title = escapeHtml(rawTitle);
              const link = sanitizeUrl(item.link);
              const hasLink = Boolean(link && link !== "#");

              output += `
                <li class="note-row">
                  <div class="note-row__left">
                    <svg class="note-row__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                      <polyline points="14 2 14 8 20 8"></polyline>
                      <line x1="16" y1="13" x2="8" y2="13"></line>
                      <line x1="16" y1="17" x2="8" y2="17"></line>
                      <polyline points="10 9 9 9 8 9"></polyline>
                    </svg>
                    ${hasLink ? `
                      <a href="${link}" target="_blank" rel="noopener noreferrer" class="note-row__link">
                        ${title}
                      </a>
                    ` : `
                      <span class="note-row__plain">${title}</span>
                    `}
                    ${isReported ? '<span class="note-row__flag">[Issue Reported]</span>' : ""}
                  </div>
                  ${hasLink ? `
                    <button type="button" class="btn-report" data-row="${escapeHtml(item.row)}" data-title="${title}" data-course="${escapeHtml(course)}">
                      Report
                    </button>
                  ` : ""}
                </li>
              `;
            });

            output += `
                </ul>
              </div>
            `;
          }
          output += "</div>";
        }

        ui.modalNotesStack.innerHTML = output;
      }

      function render() {
        updateSelectionBanner();
        updateFilterLabels();

        const showCalendar = (state.course === "ALL" && state.topic === "ALL");
        ui.calendarView.hidden = !showCalendar;
        ui.courseView.hidden = showCalendar;

        if (showCalendar) {
          renderCalendarGrid();
        } else {
          renderCourseDates();
        }
      }

      function bindEvents() {
        document.addEventListener("click", (e) => {
          if (!e.target.closest(".nav-filter__item")) {
            closeAllMenus();
          }
        });

        ui.deptTrigger.addEventListener("click", () => toggleMenu(ui.deptMenu, ui.deptTrigger));
        ui.secTrigger.addEventListener("click", () => toggleMenu(ui.secMenu, ui.secTrigger));
        ui.courseTrigger.addEventListener("click", () => toggleMenu(ui.courseMenu, ui.courseTrigger));
        ui.topicTrigger.addEventListener("click", () => toggleMenu(ui.topicMenu, ui.topicTrigger));

        ui.deptMenu.addEventListener("click", (e) => {
          const opt = e.target.closest(".nav-filter__option");
          if (!opt) return;

          state.dept = opt.dataset.value;
          state.sec = "";
          state.course = "ALL";
          state.topic = "ALL";

          closeAllMenus();
          syncDropdownStates();
          render();
        });

        ui.secMenu.addEventListener("click", (e) => {
          const opt = e.target.closest(".nav-filter__option");
          if (!opt) return;

          state.sec = opt.dataset.value;
          state.course = "ALL";
          state.topic = "ALL";

          closeAllMenus();
          syncDropdownStates();
          render();
        });

        ui.courseMenu.addEventListener("click", (e) => {
          const opt = e.target.closest(".nav-filter__option");
          if (!opt) return;

          state.course = opt.dataset.value;
          closeAllMenus();
          syncDropdownStates();
          render();
        });

        ui.topicMenu.addEventListener("click", (e) => {
          const opt = e.target.closest(".nav-filter__option");
          if (!opt) return;

          state.topic = opt.dataset.value;
          closeAllMenus();
          syncDropdownStates();
          render();
        });

        document.querySelectorAll(".dialog-modal").forEach(modal => {
          modal.addEventListener("click", (e) => {
            if (e.target !== modal) return;
            const rect = modal.getBoundingClientRect();
            const isClickInside = (
              e.clientX >= rect.left &&
              e.clientX <= rect.right &&
              e.clientY >= rect.top &&
              e.clientY <= rect.bottom
            );
            if (!isClickInside) {
              modal.close();
            }
          });
        });

        document.querySelectorAll("[data-close-modal]").forEach(btn => {
          btn.addEventListener("click", () => btn.closest("dialog")?.close());
        });

        ui.notesModal.addEventListener("close", () => {
          state.activeDate = null;
        });

        ui.prevMonthBtn.addEventListener("click", () => {
          state.viewDate.setMonth(state.viewDate.getMonth() - 1);
          render();
        });

        ui.nextMonthBtn.addEventListener("click", () => {
          state.viewDate.setMonth(state.viewDate.getMonth() + 1);
          render();
        });

        ui.todayBtn.addEventListener("click", () => {
          const current = new Date();
          state.viewDate = new Date(current.getFullYear(), current.getMonth(), 1);
          render();
        });

        ui.calendarCells.addEventListener("click", (e) => {
          const cell = e.target.closest("td[data-date]");
          if (cell) {
            openDateDetails(cell.dataset.date);
          }
        });

        ui.courseDatesList.addEventListener("click", (e) => {
          const card = e.target.closest("[data-date]");
          if (card?.dataset.date) {
            openDateDetails(card.dataset.date);
          }
        });

        ui.addNoteBtn.addEventListener("click", () => {
          state.manualTitleEdited = false;
          const today = formatDateKey(new Date());

          ui.formDate.max = today;
          ui.formDept.value = state.dept || config.departments[0]?.code;
          syncFormDropdowns();
          if (state.sec) {
            ui.formSec.value = state.sec;
          }
          ui.formDate.value = (state.activeDate && state.activeDate <= today) ? state.activeDate : today;

          if (state.course !== "ALL") {
            ui.formCourse.value = state.course;
          }
          if (state.topic !== "ALL") {
            ui.formTopic.value = state.topic;
          }

          calculateDefaultTitle();
          ui.addModal.showModal();
        });

        ui.formDept.addEventListener("change", () => {
          syncFormDropdowns();
          calculateDefaultTitle();
        });

        [ui.formSec, ui.formDate, ui.formCourse].forEach(el => {
          el.addEventListener("change", calculateDefaultTitle);
        });

        ui.formTitle.addEventListener("input", () => {
          state.manualTitleEdited = ui.formTitle.value.trim().length > 0;
        });

        ui.addForm.addEventListener("submit", async (e) => {
          e.preventDefault();

          setButtonLoading(ui.btnSubmitNote, true);

          const formattedUrl = normalizeUrl(ui.formLink.value);
          const payload = {
            department: ui.formDept.value,
            section: ui.formSec.value,
            date: ui.formDate.value,
            course: ui.formCourse.value,
            topic: ui.formTopic.value,
            title: ui.formTitle.value,
            link: formattedUrl,
            status: "Pending"
          };

          try {
            await syncData(payload);
            ui.addModal.close();
            ui.addForm.reset();
            state.manualTitleEdited = false;
            showToast("Note submitted successfully for section review!");
          } catch (err) {
            showToast("Failed to submit note. Please retry.");
          } finally {
            setButtonLoading(ui.btnSubmitNote, false);
          }
        });

        ui.modalNotesStack.addEventListener("click", (e) => {
          const btn = e.target.closest(".btn-report");
          if (!btn) return;

          setButtonLoading(ui.btnSubmitReport, false);
          ui.reportTitle.textContent = btn.dataset.title;
          ui.reportContext.textContent = `${btn.dataset.course} • ${formatReadableDate(state.activeDate)}`;
          ui.reportForm.dataset.targetRow = btn.dataset.row;
          ui.reportModal.showModal();
        });

        ui.reportForm.addEventListener("submit", async (e) => {
          e.preventDefault();

          const row = ui.reportForm.dataset.targetRow;
          const key = `reported_row_${row}`;

          if (safeStorage.get(key)) {
            ui.reportModal.close();
            showToast("You have already reported this link.");
            return;
          }

          setButtonLoading(ui.btnSubmitReport, true);

          try {
            await syncData({ type: "report", row });
            safeStorage.set(key, "true");
            ui.reportModal.close();
            showToast("Thank you. Link report has been recorded.");
          } catch (err) {
            showToast("Could not submit report. Check internet.");
          } finally {
            setButtonLoading(ui.btnSubmitReport, false);
          }
        });
      }

      function init() {
        const codes = config.departments.map(d => d.code);
        renderFormOptions(ui.formDept, codes);

        syncDropdownStates();
        bindEvents();
        render();
        loadNotes();
      }

      document.addEventListener("DOMContentLoaded", init);
    })();
  </script>
</body>
</html>
